# Google service accounts from terraform output workload_service_accounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-staging-api@fandomscore-staging.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-staging-worker@fandomscore-staging.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-staging-migrate@fandomscore-staging.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redaction
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-staging-redaction@fandomscore-staging.iam.gserviceaccount.com
