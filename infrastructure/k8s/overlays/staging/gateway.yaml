# Names from terraform output: api_ip_address_name, certificate_map, security_policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api
  annotations:
    networking.gke.io/certmap: fandomscore-staging-api
spec:
  addresses:
    - type: networking.gke.io/named-address
      value: fandomscore-staging-api
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  hostnames:
    - api.staging.example.com
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api
spec:
  default:
    securityPolicy: fandomscore-staging-api
