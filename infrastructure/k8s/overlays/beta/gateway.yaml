# Names from terraform output: api_ip_address_name, certificate_map, security_policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api
  annotations:
    networking.gke.io/certmap: fandomscore-beta-api
spec:
  addresses:
    - type: NamedAddress
      value: fandomscore-beta-api
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  hostnames:
    - api.beta.firstline.com
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api
spec:
  default:
    securityPolicy: fandomscore-beta-api
---
# The web apps' hostnames: each needs a certificate map entry (terraform variable web_domains) and an A record to the
# same address as the API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  hostnames:
    - app.beta.firstline.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: promoter-web
spec:
  hostnames:
    - promoters.beta.firstline.com
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: web
spec:
  default:
    securityPolicy: fandomscore-beta-api
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: promoter-web
spec:
  default:
    securityPolicy: fandomscore-beta-api
