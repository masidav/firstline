apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# beta: GCP project project-ef36a8a9-d958-4163-b4c (display name "firstline", number 494880048811) in us-central1. Values here must match infrastructure/terraform/envs/beta.
namespace: fandomscore

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: beta

resources:
  - ../../base
  - secrets.yaml

# deploy.sh sets newTag to the git commit being deployed.
images:
  - name: api
    newName: us-central1-docker.pkg.dev/project-ef36a8a9-d958-4163-b4c/fandomscore/api
    newTag: latest
  - name: worker
    newName: us-central1-docker.pkg.dev/project-ef36a8a9-d958-4163-b4c/fandomscore/worker
    newTag: latest
  - name: migrate
    newName: us-central1-docker.pkg.dev/project-ef36a8a9-d958-4163-b4c/fandomscore/migrate
    newTag: latest
  - name: web
    newName: us-central1-docker.pkg.dev/project-ef36a8a9-d958-4163-b4c/fandomscore/web
    newTag: latest
  - name: promoter-web
    newName: us-central1-docker.pkg.dev/project-ef36a8a9-d958-4163-b4c/fandomscore/promoter-web
    newTag: latest

configMapGenerator:
  - name: web-config
    behavior: merge
    literals:
      - API_URL=https://api.beta.firstline.com/v1
      # The same Google web client the API accepts (Auth__Google__ClientIds) and Spotify app (Spotify__ClientId).
      - GOOGLE_WEB_CLIENT_ID=494880048811-14ch6rdq1p4vuatcebg2qq187dkgm4iv.apps.googleusercontent.com
      - SPOTIFY_CLIENT_ID=
  - name: app-config
    behavior: merge
    literals:
      # Static address of the load balancer (terraform output api_ip_address): the API trusts it as the proxy
      # that appends the client address to X-Forwarded-For. Until it is set, every client shares one
      # sign-in rate limit.
      - ForwardedHeaders__KnownProxies=136.81.191.137
      # The API's public URL (gateway.yaml hostname). Every absolute link it hands out (signed file links, score
      # cards) starts with this, never with the request's Host header; the API won't start without it outside
      # Development. Host itself is not filtered, so probes and load-balancer health checks (pod IP as Host) still work.
      - App__PublicOrigin=https://api.beta.firstline.com
      # Non-secret provider settings (.env.example). Secrets are in Secret Manager (secrets.yaml).
      - Auth__Apple__ClientIds=
      - Auth__Google__ClientIds=494880048811-14ch6rdq1p4vuatcebg2qq187dkgm4iv.apps.googleusercontent.com
      - Spotify__ClientId=
      - Spotify__RedirectUris=
      # The two web apps call the API from their own hostnames (gateway.yaml).
      - Cors__AllowedOrigins=https://app.beta.firstline.com,https://promoters.beta.firstline.com
      # Buckets from terraform output buckets: Terraform names them after the project ("<project_id>-quarantine").
      - Storage__QuarantineBucket=project-ef36a8a9-d958-4163-b4c-quarantine
      - Storage__ArchiveBucket=project-ef36a8a9-d958-4163-b4c-archive
      - Storage__MediaBucket=project-ef36a8a9-d958-4163-b4c-media

patches:
  - path: serviceaccounts.yaml
  - path: gateway.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
