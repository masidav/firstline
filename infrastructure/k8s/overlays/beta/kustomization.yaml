apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# beta: GCP project fandomscore-beta in us-central1. Values here must match infrastructure/terraform/envs/beta.
namespace: fandomscore

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: beta

resources:
  - ../../base
  - secrets.yaml

# deploy.sh sets newTag to the git commit being deployed.
images:
  - name: api
    newName: us-central1-docker.pkg.dev/fandomscore-beta/fandomscore/api
    newTag: latest
  - name: worker
    newName: us-central1-docker.pkg.dev/fandomscore-beta/fandomscore/worker
    newTag: latest
  - name: migrate
    newName: us-central1-docker.pkg.dev/fandomscore-beta/fandomscore/migrate
    newTag: latest

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      # Static address of the load balancer (terraform output api_ip_address): the API trusts it as the proxy
      # that appends the client address to X-Forwarded-For. Until it is set, every client shares one
      # sign-in rate limit.
      - ForwardedHeaders__KnownProxies=
      # Non-secret provider settings (.env.example). Secrets are in Secret Manager (secrets.yaml).
      - Auth__Apple__ClientIds=
      - Auth__Google__ClientIds=
      - Spotify__ClientId=
      - Spotify__RedirectUris=
      - Cors__AllowedOrigins=
      # Buckets from terraform output buckets.
      - Storage__QuarantineBucket=fandomscore-beta-quarantine
      - Storage__ArchiveBucket=fandomscore-beta-archive
      - Storage__MediaBucket=fandomscore-beta-media

patches:
  - path: serviceaccounts.yaml
  - path: gateway.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
