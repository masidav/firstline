# Secret Manager secrets each workload may read, mounted as files named after the configuration key.
# Must match secret_readers in infrastructure/terraform/modules/environment/main.tf; every listed secret
# needs at least one version or the pod cannot start.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/fandomscore-prod/secrets/ConnectionStrings__Database/versions/latest
        path: ConnectionStrings__Database
      - resourceName: projects/fandomscore-prod/secrets/Database__ServerCa/versions/latest
        path: Database__ServerCa
      - resourceName: projects/fandomscore-prod/secrets/Auth__SigningKey/versions/latest
        path: Auth__SigningKey
      - resourceName: projects/fandomscore-prod/secrets/Spotify__ClientSecret/versions/latest
        path: Spotify__ClientSecret
      - resourceName: projects/fandomscore-prod/secrets/Spotify__TokenKey/versions/latest
        path: Spotify__TokenKey
      - resourceName: projects/fandomscore-prod/secrets/Auth__Apple__PrivateKey/versions/latest
        path: Auth__Apple__PrivateKey
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: worker-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/fandomscore-prod/secrets/ConnectionStrings__Database/versions/latest
        path: ConnectionStrings__Database
      - resourceName: projects/fandomscore-prod/secrets/Database__ServerCa/versions/latest
        path: Database__ServerCa
      - resourceName: projects/fandomscore-prod/secrets/Spotify__ClientSecret/versions/latest
        path: Spotify__ClientSecret
      - resourceName: projects/fandomscore-prod/secrets/Spotify__TokenKey/versions/latest
        path: Spotify__TokenKey
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: migrate-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/fandomscore-prod/secrets/ConnectionStrings__Database/versions/latest
        path: ConnectionStrings__Database
      - resourceName: projects/fandomscore-prod/secrets/Database__ServerCa/versions/latest
        path: Database__ServerCa
