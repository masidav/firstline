apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod: GCP project fandomscore-prod in us-central1. Values here must match infrastructure/terraform/envs/prod.
namespace: fandomscore

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: prod

resources:
  - ../../base
  - secrets.yaml

# deploy.sh sets newTag to the git commit being deployed.
images:
  - name: api
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/api
    newTag: latest
  - name: worker
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/worker
    newTag: latest
  - name: migrate
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/migrate
    newTag: latest

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      # Static address of the load balancer (terraform output api_ip_address): the API trusts it as the proxy
      # that appends the client address to X-Forwarded-For. Until it is set, every client shares one
      # sign-in rate limit.
      - ForwardedHeaders__KnownProxies=
      # Non-secret provider settings (.env.example). Secrets are in Secret Manager (secrets.yaml).
      - Auth__Apple__ClientIds=
      - Auth__Google__ClientIds=
      - Spotify__ClientId=
      - Spotify__RedirectUris=
      - Cors__AllowedOrigins=

patches:
  - path: serviceaccounts.yaml
  - path: gateway.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
