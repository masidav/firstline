apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod: GCP project fandomscore-prod in us-central1. Values here must match infrastructure/terraform/envs/prod.
namespace: fandomscore

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: prod

resources:
  - ../../base
  - secrets.yaml

# deploy.sh sets newTag to the git commit being deployed.
images:
  - name: api
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/api
    newTag: latest
  - name: worker
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/worker
    newTag: latest
  - name: migrate
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/migrate
    newTag: latest
  - name: web
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/web
    newTag: latest
  - name: promoter-web
    newName: us-central1-docker.pkg.dev/fandomscore-prod/fandomscore/promoter-web
    newTag: latest

configMapGenerator:
  # Placeholders until the prod domain is chosen (same as gateway.yaml).
  - name: web-config
    behavior: merge
    literals:
      - API_URL=https://api.example.com/v1
      # The same Google web client the API accepts (Auth__Google__ClientIds) and Spotify app (Spotify__ClientId).
      - GOOGLE_WEB_CLIENT_ID=
      - SPOTIFY_CLIENT_ID=
  - name: app-config
    behavior: merge
    literals:
      # Static address of the load balancer (terraform output api_ip_address): the API trusts it as the proxy
      # that appends the client address to X-Forwarded-For. Until it is set, every client shares one
      # sign-in rate limit.
      - ForwardedHeaders__KnownProxies=
      # Non-secret provider settings (.env.example). Secrets are in Secret Manager (secrets.yaml).
      - Auth__Apple__ClientIds=
      - Auth__Google__ClientIds=
      - Spotify__ClientId=
      - Spotify__RedirectUris=
      # The two web apps call the API from their own hostnames (gateway.yaml).
      - Cors__AllowedOrigins=https://app.example.com,https://promoters.example.com
      # Buckets from terraform output buckets: Terraform names them after the project ("<project_id>-quarantine").
      # These assume the prod project ID fandomscore-prod; set them from the output once the project exists.
      - Storage__QuarantineBucket=fandomscore-prod-quarantine
      - Storage__ArchiveBucket=fandomscore-prod-archive
      - Storage__MediaBucket=fandomscore-prod-media

patches:
  - path: serviceaccounts.yaml
  - path: gateway.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
