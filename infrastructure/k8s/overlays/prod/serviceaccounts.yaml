# Google service accounts from terraform output workload_service_accounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-prod-api@fandomscore-prod.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-prod-worker@fandomscore-prod.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-prod-migrate@fandomscore-prod.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redaction
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-prod-redaction@fandomscore-prod.iam.gserviceaccount.com
