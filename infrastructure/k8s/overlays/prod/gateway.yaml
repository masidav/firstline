# Names from terraform output: api_ip_address_name, certificate_map, security_policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api
  annotations:
    networking.gke.io/certmap: fandomscore-prod-api
spec:
  addresses:
    - type: NamedAddress
      value: fandomscore-prod-api
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  hostnames:
    - api.example.com
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: api
spec:
  default:
    securityPolicy: fandomscore-prod-api
