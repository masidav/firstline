# Google service accounts from terraform output workload_service_accounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-dev-api@fandomscore-dev.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-dev-worker@fandomscore-dev.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-dev-migrate@fandomscore-dev.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redaction
  annotations:
    iam.gke.io/gcp-service-account: fandomscore-dev-redaction@fandomscore-dev.iam.gserviceaccount.com
