# One Kubernetes service account per workload, each bound to its own Google service account through
# Workload Identity (the annotation is set per environment). Terraform creates the Google side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
# The redaction workload (submission files) is not deployed yet; its identity is the only one allowed to read
# the quarantine bucket, so it is declared here with the others.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redaction
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
