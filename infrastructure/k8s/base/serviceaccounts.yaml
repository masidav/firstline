# One Kubernetes service account per workload, each bound to its own Google service account through
# Workload Identity (the annotation is set per environment). Terraform creates the Google side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
---
# The redaction Deployment (submission files: redaction and storage.cleanup). Of the workers, only this identity can
# reach the buckets (storage.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redaction
  annotations:
    iam.gke.io/gcp-service-account: set-by-overlay
automountServiceAccountToken: false
