apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything an environment runs. Overlays set the project, images, hostnames, and sizes.
namespace: fandomscore

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: fandomscore

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - migrate-job.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - worker-deployment.yaml
  - gateway.yaml

# Non-secret settings shared by the API and worker. Overlays merge their own values into it.
configMapGenerator:
  - name: app-config
    literals:
      # Secret Manager secrets are mounted here, one file per configuration key (secrets.yaml in the overlay).
      - Secrets__Directory=/secrets
      # Google Front End ranges that connect to the pods on behalf of the external load balancer.
      - ForwardedHeaders__KnownNetworks=130.211.0.0/22,35.191.0.0/16
      - Jobs__Concurrency=2
      # Stored files: the API writes them and the worker's redaction and storage.cleanup read and delete them, so
      # Storage__* settings go here (both read this ConfigMap). In the cluster files live in Cloud Storage; each
      # overlay names its buckets (terraform output buckets).
      - Storage__Provider=gcs
