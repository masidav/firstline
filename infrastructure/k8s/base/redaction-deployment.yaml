# The jobs that touch submission files, in their own Deployment with their own identity (ADR 0002 "Files"): the
# worker image with Jobs__OnlyKinds, under the `redaction` service account, which Terraform lets read, write, and
# delete in the quarantine, archive, and media buckets (storage.tf). The `worker` Deployment excludes the same kinds
# (Jobs__ExceptKinds) and has no bucket access. Keep the two lists in step.
#   submissions.redact  verified proof: read the quarantined original, write the redacted copy to the archive
#   redaction.sweep     hourly: queue missed redactions, warn about proof close to the quarantine expiry
#   storage.cleanup     hourly: delete files no row needs any more, in all three buckets
# Same lease, liveness, and shutdown behavior as the worker (worker-deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redaction
  labels:
    app.kubernetes.io/component: redaction
    fandomscore.app/stage: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redaction
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redaction
    spec:
      serviceAccountName: redaction
      terminationGracePeriodSeconds: 60
      securityContext:
        # The image's "app" user, as in worker-deployment.yaml.
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redaction
          image: worker
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: Health__Port
              value: "8081"
            - name: Jobs__OnlyKinds
              value: submissions.redact,redaction.sweep,storage.cleanup
            # This process runs no Spotify job and is not given the Spotify secrets; an empty client ID turns the
            # Spotify client off, so startup doesn't ask for Spotify__TokenKey (env wins over the ConfigMap).
            - name: Spotify__ClientId
              value: ""
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          # Redaction decodes full-size photos (ZXing, several rotations), so the worker's memory.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redaction-secrets
        - name: tmp
          emptyDir: {}
