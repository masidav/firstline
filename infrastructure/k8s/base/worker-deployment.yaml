# Background jobs from the Postgres queue. Jobs hold a lease (Jobs__Lease, 5 min); a pod stopped mid-job
# hands it to the next poll, and handlers are idempotent, so the grace period only needs to cover the common case.
# The worker serves no traffic; its only port is the liveness endpoint (workers/hosting/WorkerHealthServer.cs):
# 503 once a job loop has been silent for Health__StaleAfter (10 min), and the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/component: worker
    fandomscore.app/stage: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 60
      securityContext:
        # The image's "app" user (APP_UID in the .NET base images). Given as a number because runAsNonRoot
        # cannot verify a named user.
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: worker
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: Health__Port
              value: "8081"
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: worker-secrets
        - name: tmp
          emptyDir: {}
