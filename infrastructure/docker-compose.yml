# Local development database. Usage (from the repo root):
#   docker compose --env-file .env -f infrastructure/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fandom_score
      POSTGRES_USER: fandom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandom -d fandom_score"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
