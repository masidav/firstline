name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FandomScore.slnx

      # Analyzer warnings are errors (Directory.Build.props), so this also enforces code style.
      - name: Build
        run: dotnet build FandomScore.slnx --configuration Release --no-restore

      # Testcontainers starts PostgreSQL 16 using the runner's Docker.
      - name: Test
        run: >
          dotnet test FandomScore.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  migrations:
    name: Applied migrations unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull requests compare with their base branch; pushes compare with the commit before the push.
      - name: Find the commit range
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            echo "range=origin/${BASE_REF}...HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${BEFORE}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "No previous commit to compare with (new branch)."
          fi

      # Migrations already on the base branch may have run somewhere; only new files are allowed.
      - name: Check for modified, renamed, or deleted migrations
        if: steps.range.outputs.range != ''
        run: |
          changed=$(git diff --name-status --no-renames "${{ steps.range.outputs.range }}" -- database/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations must not change. Add a new migration instead."
            echo "$changed"
            exit 1
          fi
          echo "Only new migrations added (or none)."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migration safety check tests
        run: python -m unittest discover -s tools/ci -v

      # Beta and prod have real users and roll out with the previous version still running (deploy.sh): a new
      # migration must not drop, rename, or tighten what that version uses. tools/ci/check_migration_safety.py.
      - name: New migrations keep the running version working
        if: steps.range.outputs.range != ''
        run: |
          git diff --name-only --diff-filter=A "${{ steps.range.outputs.range }}" -- 'database/migrations/*.sql' \
            | xargs -r python3 tools/ci/check_migration_safety.py

  # openapi.yaml is versioned (info.version) and every version that reaches main is released as `contract-v<version>`
  # (job "contract-release"), because the web apps vendor the copy they are built against (apps/*/contract,
  # docs/plans/2026-10-31-repo-split.md). An edit must bump the version; a breaking change (oasdiff) must bump the
  # major part: tools/ci/check_contract_version.py.
  contract:
    name: OpenAPI contract is valid and versioned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the contract-v* tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate openapi.yaml
        run: |
          pip install openapi-spec-validator==0.7.1
          openapi-spec-validator openapi.yaml

      - name: Latest contract release
        id: previous
        run: |
          tag=$(git tag --list 'contract-v*' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            git show "$tag:openapi.yaml" > "${RUNNER_TEMP}/previous.yaml"
            echo "Comparing with $tag."
          else
            echo "No contract release yet: this version becomes the first."
          fi

      # ERR-level findings are breaking (removed or tightened). Adding a value to a response enum or a variant to a
      # oneOf is additive here (the apps treat unknown codes generically), so tools/ci/oasdiff-severity.txt lowers
      # those two to info; oasdiff reads that file without comments. Exit 1 = breaking changes; anything else = the
      # tool failed.
      - name: Breaking changes since the latest release (oasdiff)
        id: breaking
        if: steps.previous.outputs.tag != ''
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" -v "${RUNNER_TEMP}:/tmp/previous:ro" tufin/oasdiff:latest breaking \
            --fail-on ERR --severity-levels /repo/tools/ci/oasdiff-severity.txt /tmp/previous/previous.yaml /repo/openapi.yaml
          status=$?
          set -e
          case "$status" in
            0) echo "breaking=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "breaking=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::oasdiff failed with status $status."; exit 1 ;;
          esac

      - name: Version bumped as the change requires
        id: version
        run: |
          args=(--current openapi.yaml)
          [ -z "${{ steps.previous.outputs.tag }}" ] || args+=(--previous "${RUNNER_TEMP}/previous.yaml")
          [ "${{ steps.breaking.outputs.breaking }}" != "true" ] || args+=(--breaking)
          python3 tools/ci/check_contract_version.py "${args[@]}"

  # On main, a changed contract is released: the tag contract-v<version> at this commit, with openapi.yaml attached
  # and the changelog since the previous release as the notes. The apps vendor it with `npm run sync:api -- <version>`.
  contract-release:
    name: Contract release
    needs: contract
    if: github.event_name == 'push' && needs.contract.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        env:
          PREVIOUS: ${{ needs.contract.outputs.previous }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          {
            echo "\`openapi.yaml\` at ${GITHUB_SHA}, contract version ${VERSION}."
            echo "Vendor it in an app with \`npm run sync:api -- ${VERSION}\`."
            if [ -n "$PREVIOUS" ]; then
              git show "$PREVIOUS:openapi.yaml" > "${RUNNER_TEMP}/previous.yaml"
              echo; echo "## Changes since ${PREVIOUS}"; echo; echo '```'
              docker run --rm -v "$PWD:/repo:ro" -v "${RUNNER_TEMP}:/tmp/previous:ro" tufin/oasdiff:latest changelog \
                /tmp/previous/previous.yaml /repo/openapi.yaml | head -400 || echo "(oasdiff could not list the changes)"
              echo '```'
            fi
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Tag and release contract-v${{ needs.contract.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.contract.outputs.version }}
        run: |
          gh release create "contract-v${VERSION}" openapi.yaml --target "$GITHUB_SHA" \
            --title "API contract ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # keeps the token out of .git/config, which the scan reads

      # Gitleaks' default rules over every file in the checkout; false positives are allowlisted in .gitleaks.toml.
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 dir /repo --no-banner --redact

  mobile:
    name: Fan app (typecheck, tests, API types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      # The vendored contract (contract/) must be the repo's openapi.yaml, and the generated client must match it.
      - name: Vendored contract and API types are up to date
        run: |
          npm run sync:api
          git diff --exit-code -- contract src/api/schema.d.ts || {
            echo "::error::contract/ or src/api/schema.d.ts is out of date. Run 'npm run sync:api' in apps/mobile."; exit 1; }

      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Web build
        run: npm run build:web

      # The iOS app can't be built on Linux, but its native project and JavaScript bundle can: this catches broken
      # config plugins, app.config.ts, and web-only imports before an EAS build does (apps/mobile/README.md).
      - name: iOS native project and bundle
        run: npm run check:ios

  promoter-web:
    name: Promoter dashboard (typecheck, tests, API types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/promoter-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/promoter-web/package-lock.json

      - run: npm ci

      - name: Vendored contract and API types are up to date
        run: |
          npm run sync:api
          git diff --exit-code -- contract src/api/schema.d.ts || {
            echo "::error::contract/ or src/api/schema.d.ts is out of date. Run 'npm run sync:api' in apps/promoter-web."; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The dev seed (tools/dev/seed.py) must keep working against the current schema and triggers.
  seed:
    name: Dev seed script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fandom_score
          POSTGRES_USER: fandom
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fandom -d fandom_score" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply migrations
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=fandom_score;Username=fandom;Password=ci
        run: dotnet run --project database

      - name: Seed and check
        env:
          PGPASSWORD: ci
        run: |
          python3 tools/dev/seed.py --sql --fans 60 --artists 4 --shows 10 \
            | psql -h localhost -U fandom -d fandom_score -v ON_ERROR_STOP=1 -q
          live=$(psql -h localhost -U fandom -d fandom_score -Atc "SELECT count(*) FROM allocation_registrations WHERE withdrawn_at IS NULL")
          scores=$(psql -h localhost -U fandom -d fandom_score -Atc "SELECT count(*) FROM user_artist_scores")
          echo "live registrations: $live, scores: $scores"
          [ "$live" -gt 0 ] && [ "$scores" -gt 0 ]

  # Critical fan journeys in a real browser: the production web build against the API and a seeded database. Beta
  # deploys from main, so a journey that breaks here would break for beta testers (apps/mobile/e2e/README.md).
  # The backend runs from its images (api, and testkit = migrate + seed) through tools/testkit/compose.yml, the way
  # the apps' suites will run it once they leave this repository (docs/plans/2026-10-31-repo-split.md, step 3).
  e2e:
    name: End-to-end journeys (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_DB_PORT: '55480'
      E2E_API_PORT: '5271'
      E2E_APP_ORIGINS: http://127.0.0.1:8081,http://127.0.0.1:8082
      E2E_DATABASE_URL: postgres://fandom:e2e@127.0.0.1:55480/fandom_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Build the api and testkit images
        run: |
          for target in api testkit; do
            docker buildx build --target "$target" --tag "fandomscore-$target" --load \
              --cache-from type=gha --cache-to type=gha,mode=max .
          done

      # The stack's token signing key, for this run only (compose reads it for every command, logs included).
      - name: Signing key
        run: |
          key="$(head -c 32 /dev/urandom | base64)"
          echo "::add-mask::$key"
          echo "E2E_SIGNING_KEY=$key" >> "$GITHUB_ENV"

      - name: Start the backend (PostgreSQL, migrations, seed, API)
        run: |
          docker compose -f tools/testkit/compose.yml up -d --wait
          for _ in $(seq 60); do
            curl -fsS "http://127.0.0.1:${E2E_API_PORT}/v1/health" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:${E2E_API_PORT}/v1/health" >/dev/null

      - name: Install
        working-directory: apps/mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Journeys
        working-directory: apps/mobile
        run: npm run e2e

      # The promoter dashboard's journeys and its axe accessibility scan of every page, against the same database and
      # API (apps/promoter-web/e2e; serious or critical violations fail the scan).
      - name: Promoter journeys and accessibility scan
        working-directory: apps/promoter-web
        run: |
          npm ci
          npm run e2e

      - name: Backend logs
        if: failure()
        run: docker compose -f tools/testkit/compose.yml logs --no-color testkit api | tail -200

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/mobile/e2e/playwright-report/
            apps/mobile/e2e/test-results/
            apps/promoter-web/e2e/playwright-report/
            apps/promoter-web/e2e/test-results/
          if-no-files-found: ignore

  # Terraform and the manifests are applied only on a real GCP project (infrastructure/README.md); until then this
  # is what keeps them valid, and the image build is what the Deploy workflow runs first.
  infrastructure:
    name: Infrastructure (terraform, kustomize, images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive -diff

      - name: Terraform validate (beta, prod)
        run: |
          for env in beta prod; do
            terraform -chdir="infrastructure/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/envs/$env" validate
          done

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize

      - name: Kustomize build (beta, prod)
        run: |
          for env in beta prod; do
            kustomize build "infrastructure/k8s/overlays/$env" > "/tmp/$env.yaml"
            echo "$env: $(grep -c '^kind:' "/tmp/$env.yaml") resources"
          done

      # The rendered manifests must match the Kubernetes API (strict: no unknown fields) and the CRDs the cluster
      # has (Gateway API, GKE policies, Secrets Store CSI) from the community CRD catalog. A CRD the catalog
      # doesn't know is skipped, not failed, so a catalog change can't block a deploy; the summary shows the count.
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Kubeconform (beta, prod)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/beta.yaml /tmp/prod.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Build the api, worker, migrate, testkit, web, and promoter-web images
        run: |
          for target in api worker migrate testkit web promoter-web; do
            docker buildx build --target "$target" --output type=cacheonly \
              --cache-from type=gha --cache-to type=gha,mode=max .
          done

  # The server images must start with production settings, not just build: the migrator applies every migration to
  # an empty database, the API answers its health check and refuses anonymous calls, and the worker's liveness
  # endpoint answers with its job loops running (tools/ci/smoke-images.sh). Reuses the infrastructure job's cache.
  images:
    name: Server images start (migrate, api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the migrate, api, and worker images
        run: |
          for target in migrate api worker; do
            docker buildx build --target "$target" --tag "fandomscore-$target" --load \
              --cache-from type=gha --cache-to type=gha,mode=max .
          done

      - name: Start them against PostgreSQL 16 and check their health endpoints
        run: tools/ci/smoke-images.sh

  # Scripts, workflows, and the Dockerfile are linted the same way locally (each tool's comment says how).
  lint:
    name: Lint (shell scripts, workflows, Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Every tracked shell script. Locally: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -S warning <files>
      - name: ShellCheck
        run: |
          shellcheck --version | head -2
          git ls-files -z -- '*.sh' | xargs -0 shellcheck -S warning

      # Workflow syntax, expressions, action inputs, and the `run:` scripts (through shellcheck).
      # Locally: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color -oneline

      # Rules ignored on purpose are listed, with reasons, in .hadolint.yaml.
      - name: hadolint
        run: docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.12.0 hadolint Dockerfile

  # Known vulnerabilities in what ships: every NuGet package (including transitive) and the web apps' runtime
  # dependencies. The fan app's Expo pins carry known high-severity advisories in packages that never see untrusted
  # input in a static web build (zod inside expo's config loader); those are listed for information and the job
  # fails only on a critical one until Expo moves on.
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FandomScore.slnx

      - name: NuGet packages
        run: |
          dotnet list FandomScore.slnx package --vulnerable --include-transitive | tee /tmp/nuget.txt
          if grep -q 'has the following vulnerable packages' /tmp/nuget.txt; then
            echo "::error::A NuGet package has a known vulnerability. Update it (see above)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Promoter dashboard (runtime dependencies, high or worse)
        working-directory: apps/promoter-web
        run: npm audit --omit=dev --audit-level=high

      - name: Fan app (runtime dependencies, critical)
        working-directory: apps/mobile
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::The fan app has high-severity advisories (listed above); only critical ones fail this job."
          npm audit --omit=dev --audit-level=critical

  agent-hooks:
    name: Agent hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test hook scripts
        run: python -m unittest discover -s tools/agent-hooks -v
