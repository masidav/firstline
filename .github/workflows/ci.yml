name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FandomScore.slnx

      # Analyzer warnings are errors (Directory.Build.props), so this also enforces code style.
      - name: Build
        run: dotnet build FandomScore.slnx --configuration Release --no-restore

      # Testcontainers starts PostgreSQL 16 using the runner's Docker.
      - name: Test
        run: >
          dotnet test FandomScore.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  migrations:
    name: Applied migrations unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull requests compare with their base branch; pushes compare with the commit before the push.
      - name: Find the commit range
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            echo "range=origin/${BASE_REF}...HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${BEFORE}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "No previous commit to compare with (new branch)."
          fi

      # Migrations already on the base branch may have run somewhere; only new files are allowed.
      - name: Check for modified, renamed, or deleted migrations
        if: steps.range.outputs.range != ''
        run: |
          changed=$(git diff --name-status --no-renames "${{ steps.range.outputs.range }}" -- database/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations must not change. Add a new migration instead."
            echo "$changed"
            exit 1
          fi
          echo "Only new migrations added (or none)."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migration safety check tests
        run: python -m unittest discover -s tools/ci -v

      # Beta and prod have real users and roll out with the previous version still running (deploy.sh): a new
      # migration must not drop, rename, or tighten what that version uses. tools/ci/check_migration_safety.py.
      - name: New migrations keep the running version working
        if: steps.range.outputs.range != ''
        run: |
          git diff --name-only --diff-filter=A "${{ steps.range.outputs.range }}" -- 'database/migrations/*.sql' \
            | xargs -r python3 tools/ci/check_migration_safety.py

  contract:
    name: OpenAPI contract is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate openapi.yaml
        run: |
          pip install openapi-spec-validator==0.7.1
          openapi-spec-validator openapi.yaml

  mobile:
    name: Fan app (typecheck, tests, API types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      # The generated client must match openapi.yaml.
      - name: API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date. Run 'npm run generate:api' in apps/mobile."; exit 1; }

      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Web build
        run: npm run build:web

      # The iOS app can't be built on Linux, but its native project and JavaScript bundle can: this catches broken
      # config plugins, app.config.ts, and web-only imports before an EAS build does (apps/mobile/README.md).
      - name: iOS native project and bundle
        run: npm run check:ios

  promoter-web:
    name: Promoter dashboard (typecheck, tests, API types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/promoter-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/promoter-web/package-lock.json

      - run: npm ci

      - name: API types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date. Run 'npm run generate:api' in apps/promoter-web."; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The dev seed (tools/dev/seed.py) must keep working against the current schema and triggers.
  seed:
    name: Dev seed script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fandom_score
          POSTGRES_USER: fandom
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fandom -d fandom_score" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply migrations
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=fandom_score;Username=fandom;Password=ci
        run: dotnet run --project database

      - name: Seed and check
        env:
          PGPASSWORD: ci
        run: |
          python3 tools/dev/seed.py --sql --fans 60 --artists 4 --shows 10 \
            | psql -h localhost -U fandom -d fandom_score -v ON_ERROR_STOP=1 -q
          live=$(psql -h localhost -U fandom -d fandom_score -Atc "SELECT count(*) FROM allocation_registrations WHERE withdrawn_at IS NULL")
          scores=$(psql -h localhost -U fandom -d fandom_score -Atc "SELECT count(*) FROM user_artist_scores")
          echo "live registrations: $live, scores: $scores"
          [ "$live" -gt 0 ] && [ "$scores" -gt 0 ]

  # Critical fan journeys in a real browser: the production web build against the API and a seeded database. Beta
  # deploys from main, so a journey that breaks here would break for beta testers (apps/mobile/e2e/README.md).
  e2e:
    name: End-to-end journeys (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fandom_e2e
          POSTGRES_USER: fandom
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fandom -d fandom_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://fandom:ci@127.0.0.1:5432/fandom_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Apply migrations
        env:
          ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=fandom_e2e;Username=fandom;Password=ci
        run: dotnet run --project database

      - name: Seed
        env:
          PGPASSWORD: ci
        run: python3 tools/dev/seed.py --fake --sql | psql -h 127.0.0.1 -U fandom -d fandom_e2e -v ON_ERROR_STOP=1 -q

      # Built ahead so the test run's `dotnet run` starts the API well inside its startup timeout.
      - name: Build the API
        run: dotnet build services/api

      - name: Install
        working-directory: apps/mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Journeys
        working-directory: apps/mobile
        run: npm run e2e

      # The promoter dashboard's journeys and its axe accessibility scan of every page, against the same database and
      # API build (apps/promoter-web/e2e; serious or critical violations fail the scan).
      - name: Promoter journeys and accessibility scan
        working-directory: apps/promoter-web
        run: |
          npm ci
          npm run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/mobile/e2e/playwright-report/
            apps/mobile/e2e/test-results/
            apps/promoter-web/e2e/playwright-report/
            apps/promoter-web/e2e/test-results/
          if-no-files-found: ignore

  # Terraform and the manifests are applied only on a real GCP project (infrastructure/README.md); until then this
  # is what keeps them valid, and the image build is what the Deploy workflow runs first.
  infrastructure:
    name: Infrastructure (terraform, kustomize, images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive -diff

      - name: Terraform validate (beta, prod)
        run: |
          for env in beta prod; do
            terraform -chdir="infrastructure/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/envs/$env" validate
          done

      - name: Install kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize

      - name: Kustomize build (beta, prod)
        run: |
          for env in beta prod; do
            kustomize build "infrastructure/k8s/overlays/$env" > "/tmp/$env.yaml"
            echo "$env: $(grep -c '^kind:' "/tmp/$env.yaml") resources"
          done

      # The rendered manifests must match the Kubernetes API (strict: no unknown fields) and the CRDs the cluster
      # has (Gateway API, GKE policies, Secrets Store CSI) from the community CRD catalog. A CRD the catalog
      # doesn't know is skipped, not failed, so a catalog change can't block a deploy; the summary shows the count.
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Kubeconform (beta, prod)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/beta.yaml /tmp/prod.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Build the api, worker, migrate, web, and promoter-web images
        run: |
          for target in api worker migrate web promoter-web; do
            docker buildx build --target "$target" --output type=cacheonly \
              --cache-from type=gha --cache-to type=gha,mode=max .
          done

  # The server images must start with production settings, not just build: the migrator applies every migration to
  # an empty database, the API answers its health check and refuses anonymous calls, and the worker's liveness
  # endpoint answers with its job loops running (tools/ci/smoke-images.sh). Reuses the infrastructure job's cache.
  images:
    name: Server images start (migrate, api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the migrate, api, and worker images
        run: |
          for target in migrate api worker; do
            docker buildx build --target "$target" --tag "fandomscore-$target" --load \
              --cache-from type=gha --cache-to type=gha,mode=max .
          done

      - name: Start them against PostgreSQL 16 and check their health endpoints
        run: tools/ci/smoke-images.sh

  # Scripts, workflows, and the Dockerfile are linted the same way locally (each tool's comment says how).
  lint:
    name: Lint (shell scripts, workflows, Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Every tracked shell script. Locally: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -S warning <files>
      - name: ShellCheck
        run: |
          shellcheck --version | head -2
          git ls-files -z -- '*.sh' | xargs -0 shellcheck -S warning

      # Workflow syntax, expressions, action inputs, and the `run:` scripts (through shellcheck).
      # Locally: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color -oneline

      # Rules ignored on purpose are listed, with reasons, in .hadolint.yaml.
      - name: hadolint
        run: docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.12.0 hadolint Dockerfile

  # Known vulnerabilities in what ships: every NuGet package (including transitive) and the web apps' runtime
  # dependencies. The fan app's Expo pins carry known high-severity advisories in packages that never see untrusted
  # input in a static web build (zod inside expo's config loader); those are listed for information and the job
  # fails only on a critical one until Expo moves on.
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FandomScore.slnx

      - name: NuGet packages
        run: |
          dotnet list FandomScore.slnx package --vulnerable --include-transitive | tee /tmp/nuget.txt
          if grep -q 'has the following vulnerable packages' /tmp/nuget.txt; then
            echo "::error::A NuGet package has a known vulnerability. Update it (see above)."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Promoter dashboard (runtime dependencies, high or worse)
        working-directory: apps/promoter-web
        run: npm audit --omit=dev --audit-level=high

      - name: Fan app (runtime dependencies, critical)
        working-directory: apps/mobile
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::The fan app has high-severity advisories (listed above); only critical ones fail this job."
          npm audit --omit=dev --audit-level=critical

  agent-hooks:
    name: Agent hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test hook scripts
        run: python -m unittest discover -s tools/agent-hooks -v
