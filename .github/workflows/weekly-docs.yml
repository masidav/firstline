# Weekly product documentation: plain-English summaries for non-technical readers.
# Claude reads the repository and follows docs/product/PROMPTS.md (edit that file to change the output), then
# this workflow commits what changed. Needs the ANTHROPIC_API_KEY repository secret.
name: Weekly product docs

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        default: all
        options:
          - all
          - folder-summaries
          - business-logic
          - product-description

permissions:
  contents: write

concurrency:
  group: weekly-docs
  cancel-in-progress: false

jobs:
  docs:
    name: Rewrite product docs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the folder-summaries task uses git log to find folders changed this week

      - name: Run Claude over the repository
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Read,Glob,Grep,Edit,Write,Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(find:*),Bash(cat:*),Bash(head:*),Bash(wc:*)
          prompt: |
            You are the weekly product documentation job for this repository.

            1. Read docs/product/PROMPTS.md in full. Its "Voice" section applies to everything you write.
            2. Run the task(s) selected below by following the matching "## Task:" section of that file, in
               this order: folder-summaries, business-logic, product-description. The product description
               synthesizes the other two, so always run it last.
            3. Only change files that the tasks name: README.md files (not the root README.md) and the
               documents under docs/product/. Never touch docs/product/PROMPTS.md, code, tests, migrations,
               openapi.yaml, TODO.md files, or workflows.
            4. Do not run git commit or git push. This workflow commits for you.
            5. When you finish, print a short list of the files you changed.

            Selected task(s): ${{ inputs.task || 'all' }}

      - name: Commit and push what changed
        env:
          TASK: ${{ inputs.task || 'all' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only what the job is allowed to write; anything else Claude touched is left out on purpose.
          git add -- docs/product ':(glob)**/README.md' ':(exclude)README.md' ':(exclude)docs/product/PROMPTS.md'
          if git diff --cached --quiet; then
            echo "No documentation changes this week."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "docs: weekly product documentation (${TASK}) [skip ci]" \
            -m "Generated by .github/workflows/weekly-docs.yml from docs/product/PROMPTS.md."
          git push origin HEAD:main
