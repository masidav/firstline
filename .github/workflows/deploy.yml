# Deploys beta on every push to main, and promotes the same images to prod after approval. Only what changed is built
# and rolled out: each component (backend = api/worker/migrate, web, promoter-web) has a version, the last commit that
# changed its sources (infrastructure/k8s/versions.sh, overlays/<env>/versions.env), and its images are tagged with
# it. A web-only push rolls out that web app alone (no backup, no migrate Job); a docs- or Terraform-only push deploys
# nothing. A manual run does every step (backup, migrate Job, settings, seed) unless told `changed`.
# Beta has real users, so a push to main must not break it: CI blocks migrations the running version can't live with
# (tools/ci/check_migration_safety.py), deploy.sh takes a Cloud SQL backup before the migrate Job, migrations run
# before any new pod takes traffic, and the deploy fails (leaving the previous images available for a rollback) if
# the health endpoint doesn't answer afterwards. dev is not deployed: it runs on the developer's machine.
# Authentication is Workload Identity Federation (no keys): each GitHub environment holds the variables
# GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, and GCP_DEPLOY_SA (terraform outputs), and the prod environment
# has required reviewers. Nothing runs until the repository variable DEPLOY_ENABLED is "true" (set it once the
# environments exist). See infrastructure/README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy beta only, or beta and then prod (after approval). Prod always goes through beta first.
        type: choice
        options: [beta, prod]
        default: beta
      deploy:
        description: all = every step (backup, migrate Job, settings, seed, rollout) even if nothing changed, e.g. after db-wipe.sh; changed = only what differs, like a push
        type: choice
        options: [all, changed]
        default: all
      skip_health_check:
        description: Don't poll the public health endpoint afterwards (only before DNS and the certificate exist)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One deploy at a time: beta then prod, in commit order. A newer push replaces a waiting run; that is safe because a
# run deploys every component's version as of its commit, not just the changes in its own push.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  beta:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: beta
      deploy_all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'all' }}
      skip_health_check: ${{ github.event.inputs.skip_health_check == 'true' }}

  # Also gated on PROD_DEPLOY_ENABLED: until the prod project and GitHub environment exist, a push only deploys beta.
  prod:
    needs: beta
    if: vars.DEPLOY_ENABLED == 'true' && vars.PROD_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event.inputs.environment == 'prod')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      deploy_all: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'all' }}
      # Same image digests as beta, copied into the prod registry.
      promote_from: ${{ needs.beta.outputs.image_repository }}
