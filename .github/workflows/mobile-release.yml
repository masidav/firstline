# Builds the phone apps in EAS Build (Expo's cloud; the Mac work happens there) and, if asked, submits them:
# iOS to TestFlight, Android to Google Play's testing tracks. Profiles are in apps/mobile/eas.json; what each needs
# is in apps/mobile/README.md "Building the iOS app" (an Expo account, `eas init`, and for device builds the Apple
# Developer Program and Play Console credentials, all stored in EAS, not here).
#
# Nothing runs until the repository secret EXPO_TOKEN exists (an Expo access token: expo.dev → Account settings →
# Access tokens). Runs on demand; a release is a decision, not a side effect of a push.
name: Mobile release (EAS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: Build profile (eas.json)
        type: choice
        options: [development-simulator, development, beta, production]
        default: beta
      submit:
        description: Submit to TestFlight / Google Play when the build finishes (beta and production only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (${{ inputs.platform }}, ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check the Expo token exists
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The repository secret EXPO_TOKEN is not set. Create an access token at expo.dev (Account settings → Access tokens) and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.profile }}" != "beta" ] && [ "${{ inputs.profile }}" != "production" ]; then
            echo "::error::Only the beta and production profiles can be submitted."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # The native project and bundle are generated the same way CI checks them on every push (npm run check:ios).
      - name: EAS build
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '' }}
