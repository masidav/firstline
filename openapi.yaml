  # ------------------------------------------------------------------ Submissions
  /submissions:
    post:
      tags: [Submissions]
      operationId: createSubmission
      summary: Submit a ticket, merch, screenshot, or concert photo
      description: |
        Upload files first (`POST /uploads`), then submit their ids. With no automated checks yet, every
        submission starts as `needs_review` for staff. A same-user duplicate (the same photo, unless it was
        rejected) returns `409 duplicate_submission`. 20 submissions per day per user.
        Duplicates against other users are handled silently by verification (never revealed).
        `client_extracted` carries optional on-device OCR text; the server still verifies on its own.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionCreate'}
      responses:
        '201':
          description: Accepted for verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/submissions:
    get:
      tags: [Submissions]
      operationId: listMySubmissions
      summary: My submissions
      parameters:
        - {name: artist_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SubmissionStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of submissions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /submissions/{submissionId}:
    parameters:
      - {$ref: '#/components/parameters/SubmissionId'}
    get:
      tags: [Submissions]
      operationId: getSubmission
      summary: Submission status and details
      description: |
        File URLs are short-lived signed links. After archiving, only the redacted copy is available.
        `rejection_reason` is user-facing and generic; fraud signals are never exposed.
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Submissions]
      operationId: withdrawSubmission
      summary: Withdraw a submission
      description: Allowed while `pending`, `processing`, `needs_review`, or `rejected`. Verified submissions cannot be withdrawn.
      responses:
        '204': {description: Withdrawn}
        '409': {$ref: '#/components/responses/Conflict'}
        '404': {$ref: '#/components/responses/NotFound'}
  /submissions/{submissionId}/share:
    put:
      tags: [Submissions]
      operationId: shareSubmission
      summary: Share a verified photo to the home feed, or stop sharing
      description: |
        Only verified `merch` and `concert_photo` submissions can be shared (`can_share`). Tickets and screenshots
        never are: they can show barcodes or personal details. A later rejection takes the photo off the feed.
      parameters:
        - {$ref: '#/components/parameters/SubmissionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              properties:
                shared: {type: boolean}
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ------------------------------------------------------------------ Feed
  /feed:
    get:
      tags: [Feed]
      operationId: getFeed
      summary: Home feed
      description: |
        One vertical scroll mixing, at random: shared photos (verified merch and concert photos, once every file is
        redacted and archived) and public album
        logs from every fan; from the fans the caller follows, their followers-only logs, grab-bag songs, and top
        fandom stats; upcoming shows (within 120 days) of artists the caller has a score for or in their hub cities,
        with the fan allocation to register for; and the caller's own live registrations with their standing.

        Each source contributes its newest items (up to 100); the pools are shuffled together by `seed`, so one seed
        gives one stable order to page through with `cursor`. Send a new seed to get a new mix (the app picks one
        per refresh); without one the mix is stable for the UTC day. Deleted accounts, deleted or taken-down logs,
        and inactive artists are left out.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: seed
          in: query
          description: Shuffle key, 1 to 64 letters, digits, dashes, or underscores. Keep it while paging.
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
      responses:
        '200':
          description: Page of feed items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

