        open for registration. Past shows only with `include_past`.
      parameters:
        - {name: include_past, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
