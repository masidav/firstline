        '404': {$ref: '#/components/responses/NotFound'}
  /share-cards/{cardId}:
    get:
      x-planned: 'Score cards and sharing (PROJECT_TODO.md Phase 8); not built yet.'
      tags: [Share and shop]
      operationId: getShareCard
      summary: Get a share card
      description: Public. The unguessable card id is the share link; the web landing page serves Open Graph tags from it.
      security: []
      parameters:
        - {name: cardId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareCard'}
        '404': {$ref: '#/components/responses/NotFound'}
  /share-cards/{cardId}/shares:
    post:
      x-planned: 'Score cards and sharing (PROJECT_TODO.md Phase 8); not built yet.'
      tags: [Share and shop]
      operationId: recordShare
      summary: Record where a card was shared
      description: Call after the user completes a share. Appends to `shared_to`.
      parameters:
        - {name: cardId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination]
              properties:
                destination: {type: string, enum: [x, instagram_stories, instagram_feed, other]}
      responses:
        '204': {description: Recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /outbound-clicks:
    post:
      x-planned: 'Outbound click tracking (PROJECT_TODO.md Phase 8); not built yet.'
      tags: [Share and shop]
      operationId: createOutboundClick
      summary: Get a tracked link to tickets, merch, or the artist site
      description: |
        Logs the click and returns the destination URL to open in an in-app browser. Ticket links carry
        a sub id so partner purchase confirmations can be matched back to the user (see ticketing webhook).
        Tickets and merch are real-world goods; confirm current App Store and Play rules on external checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutboundClickRequest'}
      responses:
        '201':
          description: Click recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OutboundClick'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ------------------------------------------------------------------ Social
  /users:
    get:
      tags: [Social]
      operationId: searchUsers
      summary: Find fans to follow
      description: Fans whose handle or display name starts with `q` (a leading @ is ignored), the caller left out.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 60}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Matching fans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/following:
    get:
      tags: [Social]
      operationId: listFollowing
      summary: Fans the caller follows
      description: Newest follow first.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of fans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/followers:
    get:
      tags: [Social]
      operationId: listFollowers
      summary: The caller's followers
      description: Newest follower first.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of fans
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/followers/{handle}:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    delete:
      tags: [Social]
      operationId: removeFollower
      summary: Remove a follower
      description: They stop seeing the caller's followers-only logs, grab bag, and stats. Idempotent.
      responses:
        '204': {description: Not a follower}
  /me/grab-bag:
    get:
      tags: [Social]
      operationId: getMyGrabBag
      summary: The caller's grab bag
      description: Up to five favourite songs in numbered slots, shared with followers (decided 2026-10-20; can't be turned off).
      responses:
        '200':
          description: The grab bag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrabBag'}
  /me/grab-bag/{position}:
    parameters:
      - {name: position, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 5}}
    put:
      tags: [Social]
      operationId: putGrabBagSong
      summary: Put a song in a slot
      description: |
        Replaces whatever was in the slot; a song already in another slot moves to this one. The song is looked up on
        Spotify (app token). Its primary artist is tracked if nobody tracks it yet (it starts `onboarding`), without
        counting toward the daily artist limit (decided 2026-10-20).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrabBagPut'}
      responses:
        '200':
          description: The whole grab bag after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrabBag'}
        '404':
          description: 'Spotify does not know this track (`code: spotify_track_not_found`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
    delete:
      tags: [Social]
      operationId: deleteGrabBagSong
      summary: Empty a slot
      responses:
        '204': {description: Slot empty}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/bouncer-door:
    get:
      tags: [Social]
      operationId: bouncerDoor
      summary: The bouncer door
      description: |
        A song drawn at random from the grab bags of the fans the caller follows, with whose it is (decided
        2026-10-20: a recommended real track, based on the taste of someone the fan follows). A fresh draw every call.
      responses:
        '200':
          description: The draw, or why there is none
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BouncerDoor'}
  /me/grab-bag/order:
    put:
      tags: [Social]
      operationId: reorderGrabBag
      summary: Reorder the grab bag
      description: The five slots in their new order. Each of the caller's songs appears once; null leaves a slot empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 5
                  maxItems: 5
                  items: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: The grab bag in its new order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrabBag'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/scores/{artistId}/card:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    get:
      tags: [Sharing]
      operationId: getScoreCard
      summary: A shareable card of my fandom score for an artist
      description: |
        A short-lived signed link (an hour) to a 1080x1080 PNG ("Top 3% of fans of Geese", the fan's handle, the date,
        and an "Estimated" note when the percentile is an estimate), and the sentence for the share sheet. The image is
        drawn when fetched, from the current score. Nothing else about the fan is on it. `404` without a score, or when
        the artist isn't active.
      responses:
        '200':
          description: The card's link and share text
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoreCardLink'}
        '404': {$ref: '#/components/responses/NotFound'}
  /score-cards/{userId}/{artistId}.png:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      - {$ref: '#/components/parameters/ArtistId'}
      - {name: exp, in: query, required: true, schema: {type: integer}}
      - {name: sig, in: query, required: true, schema: {type: string}}
    get:
      tags: [Sharing]
      operationId: getScoreCardImage
      summary: The score card image (signed link, no sign-in)
      security: []
      responses:
        '200':
          description: The PNG
          content:
            image/png:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me/level:
    get:
      tags: [Me]
      operationId: getMyFanLevel
      summary: My overall fan level
      description: |
        Level 1 to 10 from activity across the app, computed now: the average of equally weighted parts, each 0 to 1
        (`fandom`: the three best percentiles; `albums_logged`; `verified_proof`; `trivia`: answered right; `prompts`:
        answered). Each level spans a tenth: level 1 (Roadie) is below 0.1, level 10 (Superstar) is 0.9 and up. Names:
        Roadie, Groupie, Street Team, Front Row, Backstage Pass, Opening Act, Headliner, Gold Record, Platinum,
        Superstar. It never decides tickets.
      responses:
        '200':
          description: The level and its parts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FanLevel'}
  /me/trivia:
    get:
      tags: [Social]
      operationId: getTodaysTrivia
      summary: This week's music trivia
      description: |
        One question a week about one of the fan's scored artists: trivia comes out on Tuesdays (UTC). A question stays
        the fan's until they answer it, even past its week; once answered, it shows with its results until the next
        Tuesday (`next_question_on`), when a new one comes (decided 2026-10-27). It is shared by the artist's fans that week (made from the album
        catalog by the first who asks). Once answered, `results` names up to two people the fan follows who
        got it right and the percent of fans who did. `question` is null when none of the fan's artists has enough catalog yet. The right answer is
        only included once the fan has answered. A right answer earns `trivia_correct` ledger points (0.30, a tenth
        of logging an album; decided 2026-10-25).
      responses:
        '200':
          description: This week's question, or none
          content:
            application/json:
              schema:
                type: object
                required: [question, next_question_on]
                properties:
                  question:
                    oneOf: [{$ref: '#/components/schemas/TriviaQuestion'}, {type: 'null'}]
                  next_question_on: {type: string, format: date, description: The next Tuesday.}
  /me/trivia/{questionId}/answer:
    parameters:
      - {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Social]
      operationId: answerTrivia
      summary: Answer today's question
      description: Once, and only on its day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: {type: integer, minimum: 0, description: Index of the picked option}
      responses:
        '200':
          description: The answered question with the right answer and the points earned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TriviaQuestion'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Already answered (`code: trivia_answered`). (`trivia_expired` is no longer sent: questions stay open until answered.)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /reactions/{targetType}/{targetId}/{reaction}:
    parameters:
      - {name: targetType, in: path, required: true, schema: {type: string, enum: [photo, log, prompt_answer]}}
      - {name: targetId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: reaction, in: path, required: true, schema: {$ref: '#/components/schemas/Reaction'}}
    put:
      tags: [Social]
      operationId: addReaction
      summary: React to a post
      description: |
        Emoji reactions instead of comments (decided 2026-10-25). Any post the caller can see (a shared photo, an album
        log, a prompt answer); several different emoji per post; the same one twice is still one. No points.
      responses:
        '200':
          description: The post's reactions after the change
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items: {$ref: '#/components/schemas/ReactionCount'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Social]
      operationId: removeReaction
      summary: Take a reaction back
      description: Idempotent.
      responses:
        '200':
          description: The post's reactions after the change
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items: {$ref: '#/components/schemas/ReactionCount'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /prompts/today:
    get:
      tags: [Social]
      operationId: getTodaysPrompt
      summary: This week's music prompt
      description: |
        One open question a week for everyone: prompts come out on Thursdays (UTC) and stay open until the next Thursday
        (`next_prompt_on`), from staff or the built-in library, for example "What's your best
        hypothetical band name?". `following_answers` (up to three answers from people the caller follows) is only
        filled once the caller has answered.
      responses:
        '200':
          description: The prompt, the caller's answer, and answers from people they follow
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromptToday'}
  /prompts/{promptId}/answer:
    parameters:
      - {name: promptId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Social]
      operationId: answerPrompt
      summary: Answer today's prompt
      description: Writes or rewrites the caller's answer. Only on the prompt's day. Answers show on the feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 280}
                visibility: {type: string, enum: [public, followers], default: public}
      responses:
        '200':
          description: The prompt with the caller's answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromptToday'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Not the prompt''s day (`code: prompt_closed`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Social]
      operationId: withdrawPromptAnswer
      summary: Withdraw your answer
      description: Only on the prompt's day. Idempotent.
      responses:
        '204': {description: No answer}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Not the prompt''s day (`code: prompt_closed`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /prompts/{promptId}/answers:
    parameters:
      - {name: promptId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Social]
      operationId: listPromptAnswers
      summary: Answers to a prompt
      description: Answers the caller can see, theirs first, then people they follow, then everyone else's public ones, newest first.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of answers
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PromptAnswer'}
                  next_cursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/prompts:
    get:
      tags: [Admin]
      operationId: listPrompts
      summary: Prompts around today
      description: The last week and the next four weeks that have a prompt (days without one get a library prompt on the day).
      responses:
        '200':
          description: Prompts, latest day first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Prompt'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/prompts/{day}:
    parameters:
      - {name: day, in: path, required: true, schema: {type: string, format: date}}
    put:
      tags: [Admin]
      operationId: schedulePrompt
      summary: Set a week's prompt
      description: A Thursday (prompts come out on Thursdays), this week's or later. Refused once fans have answered that week's prompt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: The prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Admin]
      operationId: unschedulePrompt
      summary: Remove a day's prompt
      description: Refused once fans have answered it. The day then gets a library prompt.
      responses:
        '204': {description: No prompt that day}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /featured:
    get:
      tags: [Social]
      operationId: getFeaturedArtist
      summary: This week's featured artist
      description: |
        The staff pick for the current week (Monday to Sunday, UTC): the artist, a video (an uploaded MP4 through a
        signed link, or a YouTube or TikTok link with an embeddable URL), and a song on Spotify. Null when no pick.
      responses:
        '200':
          description: The pick, or none
          content:
            application/json:
              schema:
                type: object
                required: [featured]
                properties:
                  featured:
                    oneOf: [{$ref: '#/components/schemas/FeaturedArtist'}, {type: 'null'}]
  /featured/videos/{uploadId}:
    parameters:
      - {name: uploadId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: exp, in: query, required: true, schema: {type: integer}}
      - {name: sig, in: query, required: true, schema: {type: string}}
    get:
      tags: [Social]
      operationId: getFeaturedVideo
      summary: An uploaded featured video
      description: |
        Signed, short-lived link from `FeaturedArtist.video.url`; needs no sign-in. Supports range requests. Where
        files are in Cloud Storage, this redirects (302) to a 15-minute storage link, which supports ranges too.
      security: []
      responses:
        '200':
          description: The MP4
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '206':
          description: Part of the MP4, for a `Range` request
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '302':
          description: The video is in Cloud Storage; `Location` is a short-lived link to it.
          headers:
            Location:
              schema: {type: string, format: uri}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/featured:
    get:
      tags: [Admin]
      operationId: listFeaturedArtists
      summary: Featured picks
      description: The last four weeks and everything scheduled, newest first.
      responses:
        '200':
          description: Picks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/FeaturedArtist'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/featured/{weekStart}:
    parameters:
      - {name: weekStart, in: path, required: true, description: The Monday the week starts on, schema: {type: string, format: date}}
    put:
      tags: [Admin]
      operationId: putFeaturedArtist
      summary: Pick the featured artist for a week
      description: |
        Creates or replaces the week's pick. Send `video_url` (a YouTube or TikTok link) or `video_upload_id` (a
        finished `featured_video` upload), not both. `spotify_track` is an open.spotify.com/track link or a track id;
        the title and cover come from Spotify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artist_id, spotify_track]
              properties:
                artist_id: {type: string, format: uuid}
                headline: {type: [string, 'null'], maxLength: 200}
                video_url: {type: string, format: uri}
                video_upload_id: {type: string, format: uuid}
                spotify_track: {type: string}
      responses:
        '200':
          description: The pick
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeaturedArtist'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'Spotify does not know this track (`code: spotify_track_not_found`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
    delete:
      tags: [Admin]
      operationId: deleteFeaturedArtist
      summary: Remove a week's pick
      responses:
        '204': {description: No pick that week}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /users/{handle}/stats:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      tags: [Social]
      operationId: getUserStats
      summary: A fan's fandom stats
      description: |
        For the fan and their followers (decided 2026-10-20: followers see top fandom stats): artists with percentile
        and rank, journal and proof counts, ledger points. Listening counts stay private. Stats are followers-only
        (decided 2026-10-25: none are public by default), so others get 403.
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileStats'}
        '403':
          description: 'The caller does not follow this fan (`code: followers_only`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{handle}/answers:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      tags: [Social]
      operationId: listUserPromptAnswers
      summary: A fan's prompt answers
      description: The last 20 the caller may see (public ones, followers-only ones for followers), newest first, with their prompts.
      responses:
        '200':
          description: Answers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [answer, prompt_text, day]
                      properties:
                        answer: {$ref: '#/components/schemas/PromptAnswer'}
                        prompt_text: {type: string}
                        day: {type: string, format: date}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{handle}/grab-bag:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      tags: [Social]
      operationId: getUserGrabBag
      summary: A fan's grab bag
      description: Followers (and the owner) only.
      responses:
        '200':
          description: The grab bag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrabBag'}
        '403':
          description: 'The caller does not follow this fan (`code: followers_only`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
  /tracks/search:
    get:
      tags: [Social]
      operationId: searchTracks
      summary: Search Spotify for songs
      description: |
        For the grab bag. Searches Spotify with the app token (at most 10 results per search for development-mode
        apps; 30 searches per minute per user, shared with artist search) and marks each credited artist that is
        already tracked. Does not need the user to have connected Spotify.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TrackSearchResult'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /users/{handle}:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      tags: [Social]
      operationId: getUser
      summary: Public profile
      description: |
        Counts and how the fan and the caller relate. Scores are not part of the public profile (open question:
        whether to allow opt-in public scores); followers see top fandom stats on the home feed instead.
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPublic'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{handle}/logs:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      tags: [Social]
      operationId: listUserLogs
      summary: A user's visible logs
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of logs visible to the caller
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogPage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{handle}/lists:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    get:
      x-planned: 'Ordered album lists (PROJECT_TODO.md Phase 6); not built yet.'
      tags: [Social]
      operationId: listUserLists
      summary: A user's visible lists
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of lists visible to the caller
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListPage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{handle}/follow:
    parameters:
      - {$ref: '#/components/parameters/Handle'}
    put:
      tags: [Social]
      operationId: followUser
      summary: Follow a fan
      description: |
        No approval needed (decided 2026-10-20). Followers see the fan's followers-only logs, grab bag, and top
        fandom stats on the home feed. Idempotent.
      responses:
        '204': {description: Following}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Social]
      operationId: unfollowUser
      summary: Unfollow a fan
      description: Idempotent.
      responses:
        '204': {description: Not following}
  /reports:
    post:
      tags: [Social]
      operationId: createReport
      summary: Report a post on the feed
      description: |
        A shared photo or a public album log by another fan. Staff review reports and take the post down or
        dismiss them. Reporting the same post again while your report is open changes nothing. 30 reports per day.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportCreate'}
      responses:
        '202': {description: Report received}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}

  # ------------------------------------------------------------------ Webhooks
  /webhooks/ticketing/{partner}:
    post:
      x-planned: 'Primary ticketing integration (PROJECT_TODO.md Phase 11); not built yet.'
      tags: [Webhooks]
      operationId: ticketingWebhook
      summary: Ticket partner purchase confirmation
      description: |
        Server-to-server. Verified by HMAC signature. A confirmed purchase matched through the sub id
        creates a submission that auto-verifies via a `partner_confirm` check (the strongest signal).
        Must be idempotent on `partner_order_id`.
      security:
        - webhookSignature: []
      parameters:
        - {name: partner, in: path, required: true, schema: {type: string, maxLength: 64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketingWebhook'}
      responses:
        '204': {description: Processed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /webhooks/apple:
    post:
      tags: [Webhooks]
      operationId: receiveAppleNotification
      summary: Sign in with Apple server-to-server notifications
      description: |
        Apple posts a JWT signed with its Sign in with Apple keys (audience: our client ID). Configure this URL
        in the Apple Developer account. Effects are idempotent:
        - `consent-revoked`: the user's sessions end; signing in with Apple again returns to the same account.
        - `account-delete`: the Apple ID is gone, so the account is deleted like `DELETE /me`.
        - `email-disabled`, `email-enabled`, and unknown users: accepted, no change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: {type: string, description: JWT signed by Apple; its `events` claim names the event.}
      responses:
        '200': {description: Processed}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------ Allocations
  /events/{eventId}/guest-invite/decline:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [Allocations]
      operationId: declineGuestInvite
      summary: Decline being someone's +1 for a show
      description: |
        Before the draw, a fan someone named as their +1 can decline (they get a `guest_named` notification). It frees
        them to register for the show themselves (registration answers `named_as_guest` until then), and that fan can't
        name them again for this show. Idempotent: `declined` is 0 when there was nothing to decline.
      responses:
        '200':
          description: How many invites were declined
          content:
            application/json:
              schema:
                type: object
                required: [declined]
                properties:
                  declined: {type: integer, minimum: 0}
  /events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      tags: [Allocations]
      operationId: getEvent
      summary: A show and its fan allocations
      description: Published allocations only (including cancelled ones). Drafts are visible to staff only.
      responses:
        '200':
          description: Show
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /allocations/{allocationId}/eligibility:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    get:
      tags: [Allocations]
      operationId: getEligibility
      summary: Can I register for this allocation?
      description: |
        `reason` says why not: `not_open`, `artist_not_active`, `hub_city_required`, `no_score`,
        `below_threshold` (raw score under `min_raw_score`), `already_registered` (for another allocation of the
        same show), or `named_as_guest` (someone named the fan as their +1 for it; `POST /events/{eventId}/guest-invite/decline`
        frees them). `raw_score`, `percentile`, and `hub_match` are the fan's
        current standing; a registration keeps the values from when it was made.
        `standing` (while registration is upcoming or open, for a fan who can register or has) says where they would
        place if the draw ran now, counting equal scores against them. `likely` is true only when the seats of
        everyone ahead plus the fan's own fit within `tickets - margin_seats` (25 to start), a buffer for fans who
        register later with higher scores, so the app can say "you'll most likely get a ticket" without false hope.
        Other fans' registrations are counted from a snapshot at most a few seconds old, so `registrants` and the
        rank can lag fans who registered in that time.
      parameters:
        - name: plus_one
          in: query
          schema: {type: boolean, default: false}
          description: For a fan who hasn't registered yet, count a +1 in `standing`
      responses:
        '200':
          description: Eligibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Eligibility'}
        '404': {$ref: '#/components/responses/NotFound'}
  /allocations/{allocationId}/registration:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    put:
      tags: [Allocations]
      operationId: register
      summary: Register for an allocation
      description: |
        Registers the fan while registration is open, keeping a snapshot of their hub cities and score. One
        registration per fan per show. Registering again returns the existing registration (`200`).
        The body is optional. `plus_one` asks for a +1 (a second seat from the allocation, for a guest with an
        account): it can be turned on or off while registration is open, and a selected fan can add one after the
        draw while seats are left (`409 plus_one_unavailable` otherwise). Omitted, the +1 stays as it is.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plus_one: {type: boolean}
      responses:
        '200':
          description: Already registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registration'}
        '201':
          description: Registered
          headers:
            Location: {schema: {type: string}, description: '`/v1/allocations/{allocationId}/registration`'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registration'}
        '403':
          description: 'No score for the artist, or below the threshold (`code: not_eligible`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            `registration_closed` (not open), `artist_not_active`, `hub_city_required`, `already_registered`
            (registered for another allocation of the same show, or someone's guest for it), or
            `plus_one_unavailable` (no seat left, not selected, a named guest, or the show has started)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      tags: [Allocations]
      operationId: withdraw
      summary: Withdraw a registration
      description: |
        Allowed while registration is open. The registration is kept as withdrawn. Cancelling an allocation withdraws
        its registrations automatically, and deleting an account withdraws the fan's.
      responses:
        '204': {description: Withdrawn}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Registration has closed (`code: registration_closed`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /allocations/{allocationId}/registration/guest:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    put:
      tags: [Allocations]
      operationId: nameGuest
      summary: Name my +1's account
      description: |
        The guest needs an account (it can be created after registering). Allowed once the fan has asked for a +1,
        and after the draw only if the +1 got a seat. A guest is named once and can't be changed. The guest can't
        be the fan, registered for the same show, or another fan's guest for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: {type: string, description: 'The guest''s handle (a leading @ is ignored)'}
      responses:
        '200':
          description: Guest named
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Registration'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'No such account, no +1 seat, already named, or the guest has a ticket for the show (`code: guest_unavailable`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/registrations:
    get:
      tags: [Allocations]
      operationId: listMyRegistrations
      summary: My registrations
      description: Newest first, withdrawn ones included, at most 100.
      responses:
        '200':
          description: Registrations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MyRegistration'}
  /me/push-devices:
    put:
      tags: [Me]
      operationId: registerPushDevice
      summary: Register this phone for push notifications
      description: |
        The phone app sends its Expo push token on every launch once the fan allows notifications. Every in-app
        notification is then also pushed to the fan's live devices, unless they turned that category off (`Me.push`).
        A token already registered moves to the caller (whoever signed in last on that phone) and is switched back on.
        Not available on the web app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: {type: string, pattern: '^Expo(nent)?PushToken\[[A-Za-z0-9_-]{10,200}\]$'}
                platform: {type: string, enum: [ios, android]}
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PushDevice'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/push-devices/{deviceId}:
    parameters:
      - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [Me]
      operationId: removePushDevice
      summary: Stop pushing to this phone
      description: The app calls it on sign-out. Idempotent; only the caller's own devices.
      responses:
        '204': {description: Removed}
  /me/notifications:
    get:
      tags: [Me]
      operationId: listMyNotifications
      summary: My notifications
      description: |
        In-app notifications, newest first, with the unread count. Fans hear when a draw picks them or not, when a
        returned seat comes to them, and when their ticket is delivered; staff when a draw runs, a post gets its first
        open report, and proof waits for review. `title` and `body` are ready to show; `link` is the app screen to open.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of notifications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/notifications/read:
    post:
      tags: [Me]
      operationId: markNotificationsRead
      summary: Mark notifications read
      description: The given ones (the caller's only), or all of them when `ids` is empty or missing. Idempotent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: How many are still unread
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: {type: integer, minimum: 0}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/reservations:
    get:
      tags: [Allocations]
      operationId: listMyReservations
      summary: My reservations
      description: |
        The seats the fan holds from the draws (and the ones they are the named +1 of), newest first, at most 100.
        A reservation is non-transferable: the ticket token is shown only to its holder, and only once delivered
        (`delivery_hours_before_show` hours before the show). Until then `status` is `held` and `deliver_at` says when.
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Reservation'}
  /reservations/{reservationId}:
    parameters:
      - {name: reservationId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Allocations]
      operationId: getReservation
      summary: One reservation
      description: For its holder or named guest; anyone else gets 404.
      responses:
        '200':
          description: The reservation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /reservations/{reservationId}/return:
    parameters:
      - {name: reservationId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Allocations]
      operationId: returnReservation
      summary: Give the reservation back
      description: |
        Face-value exchange for a fan who can't attend: allowed until the show starts, by the holder only. The seats go,
        at the same face value, to the next fans down the draw's ranking who weren't selected, in the same transaction.
        Returning twice returns the same reservation.
      responses:
        '200':
          description: The returned reservation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Cancelled, or the show has started (`code: reservation_unavailable`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /admin/allocations/{allocationId}/reservations:
    parameters:
      - {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Admin]
      operationId: listAllocationReservations
      summary: Who holds seats for an allocation
      description: Staff view in ranking order; tokens are never included.
      responses:
        '200':
          description: Reservations with their holders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [handle, reservation]
                      properties:
                        handle: {type: string}
                        reservation: {$ref: '#/components/schemas/Reservation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/events:
    post:
      tags: [Admin, Allocations]
      operationId: createEvent
      summary: Add a show
      description: Staff only until promoter organizations exist. The city is one of the hub cities (`GET /cities`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreate'}
      responses:
        '201':
          description: Created
          headers:
            Location: {schema: {type: string}, description: '`/v1/events/{eventId}`'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      tags: [Admin, Allocations]
      operationId: getEventForStaff
      summary: A show with all its allocations, drafts included
      responses:
        '200':
          description: Show
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin, Allocations]
      operationId: updateEvent
      summary: Change a show
      description: |
        Partial update. Once an allocation for the show has opened, its time and city are locked
        (`allocation_locked`), and the show can never move to before an allocation's registration closes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AllocationLocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/events/{eventId}/allocations:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [Admin, Allocations]
      operationId: createAllocation
      summary: Set aside a fan allocation (as a draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocationCreate'}
      responses:
        '201':
          description: Draft created
          headers:
            Location: {schema: {type: string}, description: '`/v1/admin/allocations/{allocationId}`'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/allocations/{allocationId}:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    patch:
      tags: [Admin, Allocations]
      operationId: updateAllocation
      summary: Change an allocation's rules
      description: Partial update. Allowed until registration opens; after that, `allocation_locked`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocationUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AllocationLocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Admin, Allocations]
      operationId: deleteAllocationDraft
      summary: Delete a draft
      description: Only drafts; a published allocation is cancelled instead (`409 conflict`).
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/allocations/{allocationId}/publish:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Admin, Allocations]
      operationId: publishAllocation
      summary: Show an allocation to fans
      description: |
        Needs an active artist and a show with a city (`409 conflict` otherwise). Can't be undone. Publishing again
        returns the allocation unchanged.
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/allocations/{allocationId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Admin, Allocations]
      operationId: cancelAllocation
      summary: Cancel a published allocation
      description: Can't be undone; cancelling again returns it unchanged. Drafts are deleted instead (`409 conflict`).
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/allocations/{allocationId}/selection:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Admin, Allocations]
      operationId: runSelection
      summary: Queue the draw
      description: |
        After registration closes. Fans whose hub cities include the show's city come first, then everyone else;
        each group is ranked by the raw score in their registration snapshot, and equal scores are ordered by a
        random seed that is stored, so the draw can be repeated. Each selected fan takes one seat, two with a +1;
        when only one seat is left for a fan with a +1, they get it without the +1.
        The draw runs in the background (it is linear in the registrations, and nothing depends on how soon it
        runs): this queues it and answers `202` with its state; poll `GET` here until `status` is `done`. Calling
        again while it is queued or running changes nothing; after it has run, `200` with the recorded draw. A
        failed draw is queued again. A selected allocation can't be cancelled.
      responses:
        '202':
          description: The draw is queued (or already queued or running)
          headers:
            Location: {schema: {type: string}, description: '`/v1/admin/allocations/{allocationId}/selection`, to poll'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '200':
          description: The draw had already run (`status` is `done`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Registration still open (`code: selection_not_ready`), a draft or cancelled (`conflict`), or the artist isn''t active'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      tags: [Admin, Allocations]
      operationId: getSelection
      summary: Where the draw stands
      description: Whether the draw is not run, queued, running, failed (with why), or done (with the recorded draw).
      responses:
        '200':
          description: The draw's state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/allocations/{allocationId}/registrations:
    parameters:
      - {$ref: '#/components/parameters/AllocationId'}
    get:
      tags: [Admin, Allocations]
      operationId: listAllocationRegistrations
      summary: Registrations, in ranking order
      description: Live registrations in ranking order once the draw has run (registration order before); withdrawn ones last.
      responses:
        '200':
          description: Registrations and the draw, if it has run
          content:
            application/json:
              schema:
                type: object
                required: [selection, items]
                properties:
                  selection:
                    oneOf: [{$ref: '#/components/schemas/Selection'}, {type: 'null'}]
                  items:
                    type: array
                    items:
                      type: object
                      required: [handle, registration]
                      properties:
                        handle: {type: string}
                        registration: {$ref: '#/components/schemas/Registration'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Admin
  /admin/reviews:
    get:
      tags: [Admin]
      operationId: listReviewQueue
      summary: Manual review queue
      description: Submissions in `needs_review`, oldest first.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of queue items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubmissionPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/submissions/{submissionId}:
    get:
      tags: [Admin]
      operationId: getAdminSubmission
      summary: Full submission with checks and original files
      parameters:
        - {$ref: '#/components/parameters/SubmissionId'}
      responses:
        '200':
          description: Submission for review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubmission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/submissions/{submissionId}/decision:
    post:
      tags: [Admin]
      operationId: decideSubmission
      summary: Approve or reject a submission
      description: |
        Writes a `manual` verification check with the reviewer id, then sets the status. Approval awards
        points; approval of an already-verified order reference fails with `409`. A later `reject` of a
        verified submission reverses its points.
      parameters:
        - {$ref: '#/components/parameters/SubmissionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSubmission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/reports:
    get:
      tags: [Admin]
      operationId: listReportedPosts
      summary: Reported posts waiting for a decision
      description: One item per post with open reports, oldest report first.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of reported posts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportedPostPage'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/reports/{targetType}/{targetId}/decision:
    post:
      tags: [Admin]
      operationId: decideReportedPost
      summary: Take a reported post down, or dismiss its reports
      description: |
        Closes every open report on the post and records the decision (`moderation_actions`). Taking down a photo
        removes it from the feed for good (it stays as proof; points unchanged). Taking down a log hides it from
        everyone but its author and reverses its points.
      parameters:
        - {name: targetType, in: path, required: true, schema: {type: string, enum: [photo, log, prompt_answer]}}
        - {name: targetId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [take_down, dismiss]}
                note: {type: string, maxLength: 2000, description: Internal only.}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModerationDecision'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /clicks:
    post:
      tags: [Sharing]
      operationId: recordLinkClick
      summary: Count a tap on an outbound link
      description: |
        The app calls this when a fan opens an artist's website, merch store, or Spotify page, or a show's ticket link.
        Only the count is kept (no user id). A click is never treated as a purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, artist_id]
              properties:
                kind: {type: string, enum: [artist_website, artist_merch, artist_spotify, event_tickets]}
                artist_id: {type: string, format: uuid}
                event_id: {type: string, format: uuid, description: The show, for event_tickets only.}
      responses:
        '204': {description: Counted}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/artists/{artistId}/links:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    patch:
      tags: [Admin]
      operationId: setArtistLinks
      summary: Set an artist's website and merch store
      description: https links only; null or an empty string clears one; a missing field is left alone. The worker also fills the website from Ticketmaster when it links an artist and none is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                website_url: {type: [string, 'null'], maxLength: 500}
                merch_url: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          description: The artist's links now
          content:
            application/json:
              schema:
                type: object
                required: [artist_id, website_url, merch_url]
                properties:
                  artist_id: {type: string, format: uuid}
                  website_url: {type: [string, 'null'], format: uri}
                  merch_url: {type: [string, 'null'], format: uri}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/clicks:
    get:
      tags: [Admin]
      operationId: getLinkClicks
      summary: Outbound link clicks per artist
      description: Taps on artist, merch, Spotify, and ticket links in the last `days`, most first (at most 200 rows). Clicks, not purchases.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [days, items]
                properties:
                  days: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [artist_id, artist_name, kind, clicks]
                      properties:
                        artist_id: {type: string, format: uuid}
                        artist_name: {type: string}
                        kind: {type: string, enum: [artist_website, artist_merch, artist_spotify, event_tickets]}
                        clicks: {type: integer, minimum: 1}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/artists/{artistId}/sources:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    get:
      tags: [Admin]
      operationId: listArtistSources
      summary: Which concert-source artist this artist is
      description: |
        The worker links an artist to Ticketmaster by itself only when Ticketmaster lists the artist's Spotify page.
        `external_id` null means it looked and found no match (it looks again weekly).
      responses:
        '200':
          description: The artist's sources
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ArtistSource'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/artists/{artistId}/sources/{source}:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
      - {name: source, in: path, required: true, schema: {type: string, enum: [ticketmaster]}}
    put:
      tags: [Admin]
      operationId: linkArtistSource
      summary: Link the artist to a source's artist id
      description: |
        For artists the worker couldn't match. `external_id` is the Ticketmaster Discovery attraction id (letters and
        digits), not a ticketmaster.com link. Queues a sync of the artist's shows. `409 conflict` when another tracked
        artist holds that id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id]
              properties:
                external_id: {type: string, pattern: '^[A-Za-z0-9]{5,40}$'}
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistSource'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Admin]
      operationId: unlinkArtistSource
      summary: Remove a wrong link
      description: Shows already loaded stay. The worker may link the artist again if the source lists its Spotify page.
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/redactions:
    get:
      tags: [Admin]
      operationId: listRedactionReviews
      summary: Files the redaction worker sent to staff
      description: |
        Verified proof is scanned for barcodes and QR codes, which are blacked out before the file moves to the
        archive. A file comes here when the scanner can't settle it: a ticket or screenshot with no code found, codes
        still found after redacting, or an image that can't be read. Oldest first, at most 100. The quarantine bucket
        deletes the original at `deleted_after`.
      responses:
        '200':
          description: Files waiting for a decision
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RedactionReview'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/redactions/{fileId}/decision:
    post:
      tags: [Admin]
      operationId: decideRedaction
      summary: Archive a file staff checked, or discard it
      description: |
        `archive`: staff looked and nothing sensitive is left. The worker still blacks out any code it finds, then
        archives the file. `discard`: the file is deleted now; the submission keeps its status and points.
      parameters:
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [archive, discard]}
      responses:
        '204': {description: Decision recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/artists:
    post:
      x-planned: 'Staff artist management; not built yet (artists are added by fans and onboarded by the worker).'
      tags: [Admin]
      operationId: seedArtist
      summary: Seed an artist onto the tracked list
      description: Same as `POST /artists` but with no `added_by` and no daily limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotify_artist_id]
              properties:
                spotify_artist_id: {type: string}
      responses:
        '201':
          description: Created, onboarding started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/artists/{artistId}:
    patch:
      x-planned: 'Staff artist management; not built yet (artists are added by fans and onboarded by the worker).'
      tags: [Admin]
      operationId: updateArtistAdmin
      summary: Pause, resume, or edit an artist
      description: |
        `status` may switch between `active` and `paused` (pausing stops sync and point awards).
        Resuming fails with `409` if the artist has no baseline.
      parameters:
        - {$ref: '#/components/parameters/ArtistId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [active, paused]}
                website_url: {type: [string, 'null'], format: uri}
                merch_url: {type: [string, 'null'], format: uri}
                musicbrainz_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/artists/{artistId}/onboarding/retry:
    post:
      x-planned: 'Staff artist management; not built yet (artists are added by fans and onboarded by the worker).'
      tags: [Admin]
      operationId: retryOnboarding
      summary: Re-run onboarding for a stuck artist
      parameters:
        - {$ref: '#/components/parameters/ArtistId'}
      responses:
        '202': {description: Onboarding re-queued}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/scoring-rules:
    get:
      tags: [Admin]
      operationId: listScoringRules
      summary: Scoring weights
      responses:
        '200':
          description: All rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ScoringRule'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/scoring-rules/{ruleKey}:
    put:
      tags: [Admin]
      operationId: updateScoringRule
      summary: Change a weight, saturation, or cap
      description: |
        Partial update: only the fields sent change. For `spotify_*` rules, `points` is the signal's relative weight
        (weights need not add up to anything) and `saturation` the count that earns full marks; a change queues a
        rescore of every active artist. For ledger rules, `points` affects future awards only: existing ledger rows
        keep the points they were awarded with.
      parameters:
        - {name: ruleKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScoringRuleUpdate'}
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoringRule'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ------------------------------------------------------------------ Organizations
  /admin/organizations:
    post:
      tags: [Admin, Organizations]
      operationId: createOrganization
      summary: Create a promoter organization with its first owner
      description: |
        Staff create each promoter organization by hand (decided 2026-10-27, no self-serve sign-up), naming its first
        owner by handle; the owner signs in with the account fans use. Every membership change is audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner_handle]
              properties:
                name: {type: string, maxLength: 200}
                owner_handle: {type: string, description: An existing account's handle}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    get:
      tags: [Admin, Organizations]
      operationId: listOrganizations
      summary: Every organization, with members
      responses:
        '200':
          description: Organizations by name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationList'}
  /me/organizations:
    get:
      tags: [Organizations]
      operationId: listMyOrganizations
      summary: The organizations I belong to
      responses:
        '200':
          description: My organizations by name, with my role in each (`my_role`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganizationList'}
  /organizations/{organizationId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: An organization and its members
      description: |
        Members only. Someone who isn't a member gets `404`, as if it didn't exist. Roles: `owner` (manages members,
        and everything an admin does), `admin` (manages the organization's shows and allocations, queues draws),
        `analyst` (reads them). Every route under `/organizations/{organizationId}` works this way, and a show or
        allocation that isn't the organization's is `404` there.
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organizationId}/members/{handle}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: handle, in: path, required: true, schema: {type: string}}
    put:
      tags: [Organizations]
      operationId: putOrganizationMember
      summary: Add a member, or change a member's role
      description: Owners only. The account must exist. An organization must keep an owner (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string, enum: [owner, admin, analyst]}
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      summary: Remove a member
      description: Owners only. An organization must keep an owner (`409`).
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/events:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations, Allocations]
      operationId: listOrganizationEvents
      summary: The organization's shows with their allocations
      description: Newest show first, drafts included, at most 200. Any member.
      responses:
        '200':
          description: Shows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/EventDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Organizations, Allocations]
      operationId: createOrganizationEvent
      summary: Add a show for the organization
      description: Admins and owners. Same rules as `POST /admin/events`; `organization_id` in the body is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /organizations/{organizationId}/events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/EventId'}
    get:
      tags: [Organizations, Allocations]
      operationId: getOrganizationEvent
      summary: One of the organization's shows, drafts included
      responses:
        '200':
          description: The show
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Organizations, Allocations]
      operationId: updateOrganizationEvent
      summary: Edit one of the organization's shows
      description: Admins and owners. Same rules as `PATCH /admin/events/{eventId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdate'}
      responses:
        '200':
          description: The show
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AllocationLocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /organizations/{organizationId}/events/{eventId}/allocations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [Organizations, Allocations]
      operationId: createOrganizationAllocation
      summary: Add a fan allocation to one of the organization's shows
      description: Admins and owners. Same rules as `POST /admin/events/{eventId}/allocations`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocationCreate'}
      responses:
        '201':
          description: Created (a draft)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /organizations/{organizationId}/allocations/{allocationId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    patch:
      tags: [Organizations, Allocations]
      operationId: updateOrganizationAllocation
      summary: Edit an allocation's rules before registration opens
      description: Admins and owners. Same rules as `PATCH /admin/allocations/{allocationId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AllocationUpdate'}
      responses:
        '200':
          description: The allocation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/AllocationLocked'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Organizations, Allocations]
      operationId: deleteOrganizationAllocationDraft
      summary: Delete a draft allocation
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/allocations/{allocationId}/publish:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Organizations, Allocations]
      operationId: publishOrganizationAllocation
      summary: Publish an allocation to fans
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/allocations/{allocationId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Organizations, Allocations]
      operationId: cancelOrganizationAllocation
      summary: Cancel a published allocation (before its draw)
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Allocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/allocations/{allocationId}/selection:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    post:
      tags: [Organizations, Allocations]
      operationId: queueOrganizationSelection
      summary: Queue the draw
      description: Admins and owners. Same as `POST /admin/allocations/{allocationId}/selection`.
      responses:
        '202':
          description: The draw is queued (or already queued or running)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '200':
          description: The draw had already run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Registration still open (`code: selection_not_ready`), a draft or cancelled (`conflict`), or the artist isn''t active'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      tags: [Organizations, Allocations]
      operationId: getOrganizationSelection
      summary: Where the draw stands
      responses:
        '200':
          description: The draw's state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrawStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organizationId}/allocations/{allocationId}/registrations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    get:
      tags: [Organizations, Allocations]
      operationId: listOrganizationRegistrations
      summary: Who registered, in ranking order once the draw has run
      description: |
        Fans as handles and registration status only: no scores, hub cities, or contact details (sharing fan data
        with promoters needs the fan's consent, PROJECT_TODO.md Phase 11). Withdrawn registrations last.
      responses:
        '200':
          description: Registrations and the draw, if it has run
          content:
            application/json:
              schema:
                type: object
                required: [selection, items]
                properties:
                  selection: {oneOf: [{$ref: '#/components/schemas/Selection'}, {type: 'null'}]}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PromoterRegistration'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organizationId}/allocations/{allocationId}/reservations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {$ref: '#/components/parameters/AllocationId'}
    get:
      tags: [Organizations, Allocations]
      operationId: listOrganizationReservations
      summary: Who holds seats
      description: Same as `GET /admin/allocations/{allocationId}/reservations` (never a ticket token).
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [handle, reservation]
                      properties:
                        handle: {type: string}
                        reservation: {$ref: '#/components/schemas/Reservation'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 of the raw body with the partner shared secret.

  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, maxLength: 64}
    ArtistId:
      {name: artistId, in: path, required: true, schema: {type: string, format: uuid}}
    EventId:
      {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
    AllocationId:
      {name: allocationId, in: path, required: true, schema: {type: string, format: uuid}}
    OrganizationId:
      {name: organizationId, in: path, required: true, schema: {type: string, format: uuid}}
    AlbumId:
      {name: albumId, in: path, required: true, schema: {type: string, format: uuid}}
    LogId:
      {name: logId, in: path, required: true, schema: {type: string, format: uuid}}
    CommentId:
      {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    ListId:
      {name: listId, in: path, required: true, schema: {type: string, format: uuid}}
    SubmissionId:
      {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
    Handle:
      {name: handle, in: path, required: true, schema: {type: string, maxLength: 40}}

  responses:
    Unauthorized:
      description: Missing, expired, or invalid credentials
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AllocationLocked:
      description: 'Registration has opened, so the allocation''s rules and the show''s time and city are fixed (`code: allocation_locked`)'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: Request body or parameters are invalid
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SpotifyUnavailable:
      description: 'Spotify did not respond, or Spotify is not set up on this server (`code: spotify_unavailable`)'
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Organization:
      type: object
      description: A promoter organization (migration 0037).
      required: [id, name, kind, created_at, my_role, members]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [promoter]}
        created_at: {type: string, format: date-time}
        my_role: {type: [string, 'null'], enum: [owner, admin, analyst, null], description: The caller's role; null for staff who aren't members}
        members:
          type: array
          items: {$ref: '#/components/schemas/OrganizationMember'}
    OrganizationMember:
      type: object
      required: [handle, display_name, role, added_at]
      properties:
        handle: {type: string}
        display_name: {type: [string, 'null']}
        role: {type: string, enum: [owner, admin, analyst]}
        added_at: {type: string, format: date-time}
    OrganizationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Organization'}
    PromoterRegistration:
      type: object
      description: What a promoter sees of a fan's registration.
      required: [handle, status, local, plus_one, selection_rank, seats, registered_at, withdrawn_at]
      properties:
        handle: {type: string}
        status: {type: string, enum: [registered, withdrawn, selected, not_selected, returned]}
        local: {type: boolean, description: The show's city is one of the fan's hub cities (the draw puts local fans first)}
        plus_one: {type: boolean}
        selection_rank: {type: [integer, 'null']}
        seats: {type: [integer, 'null']}
        registered_at: {type: string, format: date-time}
        withdrawn_at: {type: [string, 'null'], format: date-time}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - unauthorized
            - forbidden
            - not_found
            - validation_failed
            - conflict
            - handle_taken
            - email_in_use
            - idempotency_conflict
            - rate_limited
            - artist_add_limit
            - allocation_locked
            - registration_closed
            - hub_city_required
            - not_eligible
            - already_registered
            - named_as_guest
            - plus_one_unavailable
            - guest_unavailable
            - selection_not_ready
            - reservation_unavailable
            - trivia_answered
            - trivia_expired
            - prompt_closed
            - hub_change_limit
            - artist_not_active
            - spotify_artist_not_found
            - spotify_track_not_found
            - followers_only
            - spotify_not_connected
            - spotify_reauth_required
            - spotify_in_use
            - spotify_unavailable
            - spotify_no_device
            - spotify_premium_required
            - spotify_player_refused
            - duplicate_submission
            - score_not_ready
            - upload_expired
            - internal_error
            - file_too_large
            - unsupported_media_type
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
    PointsAward:
      type: object
      required: [rule_key, points]
      properties:
        rule_key: {type: string}
        points: {type: number}
    UserRef:
      type: object
      required: [handle, deleted]
      properties:
        handle: {type: [string, 'null'], description: Null when the account was deleted.}
        deleted: {type: boolean, description: True for deleted accounts; render as "Deleted user".}
        display_name: {type: [string, 'null']}
        avatar_url: {type: [string, 'null'], format: uri}
    UserPublic:
      allOf:
        - $ref: '#/components/schemas/UserRef'
        - type: object
          required: [created_at, log_count, list_count, followed_by_me, follows_me, follower_count, following_count, is_artist,
                     grab_bag_count, is_me, can_see_follower_content, band_url, instagram_handle, x_handle, answer_count, fan_level]
          properties:
            created_at: {type: string, format: date-time}
            log_count: {type: integer, description: Logs the caller can see.}
            list_count: {type: integer}
            followed_by_me: {type: boolean}
            follows_me: {type: boolean}
            follower_count: {type: integer}
            following_count: {type: integer}
            is_artist: {type: boolean}
            grab_bag_count: {type: integer, description: Songs in their grab bag (visible to followers).}
            is_me: {type: boolean}
            can_see_follower_content:
              type: boolean
              description: The caller is the fan or follows them, so the grab bag, fandom stats, and followers-only posts are visible
            band_url: {type: [string, 'null'], format: uri, description: Set when is_artist}
            instagram_handle: {type: [string, 'null']}
            x_handle: {type: [string, 'null']}
            answer_count: {type: integer, description: Prompt answers the caller can see}
            fan_level:
              type: [integer, 'null']
              minimum: 1
              maximum: 10
              description: The fan's overall level (1 to 10), shown to the fan and their followers like other stats; null otherwise or before it's first computed (hourly).
            fan_level_name:
              type: [string, 'null']
              description: The level's name, Roadie (1) to Superstar (10); null when `fan_level` is.

    SessionRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider: {type: string, enum: [apple, google]}
        id_token: {type: string}
        nonce: {type: string}
        handle:
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
          description: Required when this sign-in creates a new account.
    Session:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, user, is_new_user]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer, description: Seconds}
        token_type: {type: string, const: Bearer}
        is_new_user: {type: boolean}
        user: {$ref: '#/components/schemas/Me'}
    Me:
      type: object
      required: [id, handle, email, created_at, hub_cities, is_artist, presale_reminders, push]
      properties:
        id: {type: string, format: uuid}
        handle: {type: string}
        email: {type: string, format: email}
        display_name: {type: [string, 'null']}
        avatar_url: {type: [string, 'null'], format: uri}
        is_staff: {type: boolean}
        created_at: {type: string, format: date-time}
        is_artist:
          type: boolean
          description: The fan is an artist. The band links below are only kept while this is true.
        band_url:
          type: [string, 'null']
          format: uri
          description: The band's profile page (an https link, e.g. a Spotify artist page or website).
        instagram_handle:
          type: [string, 'null']
          description: The band's Instagram handle without the @; the link is `https://instagram.com/{handle}`.
        x_handle:
          type: [string, 'null']
          description: The band's X handle without the @; the link is `https://x.com/{handle}`.
        push:
          $ref: '#/components/schemas/PushSettings'
        presale_reminders:
          type: boolean
          description: |
            Remind me of presales (a `presale` notification), on by default: once per presale, within a day of it
            opening, for shows by artists the fan has a score for in their hub cities.
        spotify:
          $ref: '#/components/schemas/SpotifyStatus'
          description: Same as `GET /me/spotify`.
        hub_cities:
          type: array
          maxItems: 3
          description: Primary first. Empty until the fan chooses them (the app asks right after sign-up).
          items: {$ref: '#/components/schemas/HubCity'}
        hub_cities_change_available_at:
          type: [string, 'null']
          format: date-time
          description: When hub cities may next be changed; null when they may be changed now.
    HubCity:
      type: object
      required: [id, name, region, country, time_zone]
      properties:
        id: {type: string, description: 'Stable id, e.g. `us-il-chicago`'}
        name: {type: string}
        region: {type: string, description: State or province code}
        country: {type: string, description: ISO 3166-1 alpha-2}
        time_zone: {type: string, description: 'IANA time zone, e.g. `America/Chicago`. Show local times with it.'}
    MeUpdate:
      type: object
      properties:
        handle: {type: string, pattern: '^[A-Za-z0-9_]{3,30}$'}
        display_name: {type: [string, 'null'], maxLength: 60}
        avatar_upload_id:
          type: [string, 'null']
          format: uuid
          description: Null removes the avatar. Setting one needs uploads (`POST /uploads`), not available yet.
        is_artist:
          type: boolean
          description: Setting false also clears `band_url`, `instagram_handle`, and `x_handle`.
        band_url:
          type: [string, 'null']
          format: uri
          maxLength: 200
          pattern: '^https://[^\s/]+'
          description: Null clears it. Needs `is_artist` (422 otherwise).
        instagram_handle:
          type: [string, 'null']
          pattern: '^@?[A-Za-z0-9._]{1,30}$'
          description: A leading @ is dropped. Null clears it. Needs `is_artist` (422 otherwise).
        x_handle:
          type: [string, 'null']
          pattern: '^@?[A-Za-z0-9_]{1,15}$'
          description: A leading @ is dropped. Null clears it. Needs `is_artist` (422 otherwise).
        presale_reminders: {type: boolean, description: Turn presale reminders on or off.}
        push:
          type: object
          description: Only the categories sent change.
          properties:
            tickets: {type: boolean}
            presales: {type: boolean}
            staff: {type: boolean}
    SpotifyConnect:
      type: object
      required: [code, code_verifier, redirect_uri]
      properties:
        code: {type: string}
        code_verifier: {type: string, minLength: 43, maxLength: 128}
        redirect_uri: {type: string}
    SpotifyStatus:
      type: object
      required: [connected, sync_state]
      properties:
        connected: {type: boolean}
        scopes:
          type: array
          items: {type: string}
          description: |
            Scopes the connection was made with. A connection made before `user-follow-read` was required lacks it;
            the sync then skips followed artists, and the app should ask the fan to connect again. Connections made
            before 2026-10-26 also lack `user-read-playback-state` and `user-modify-playback-state`, which the
            now-playing bar and play buttons need (`GET /me/spotify/player` says `reconnect_needed`).
        connected_at: {type: [string, 'null'], format: date-time}
        last_synced_at: {type: [string, 'null'], format: date-time}
        sync_state:
          type: string
          enum: [idle, queued, running, failed, reauth_required]
          description: |
            `failed`: gave up after retries, or Spotify refused the account; the daily automatic sync tries again.
            `reauth_required`: Spotify no longer accepts the authorization; only reconnecting clears it.
        sync_error:
          type: [string, 'null']
          enum: [spotify_unavailable, spotify_forbidden, spotify_reauth_required, internal_error, null]
          description: Why the last sync attempt failed; null after a successful sync.
        tracked_artists_found:
          type: integer
          description: Tracked artists found in the last sync.
        top_artists_added:
          type: integer
          description: |
            Artists from the fan's Spotify top artists that the last sync added to the tracked list because nobody
            tracked them yet. They start `onboarding` (list them with `GET /artists?added_by_me=true&status=onboarding`)
            and count toward the fan's score on the sync that follows their activation.
    SpotifyPlayer:
      type: object
      required: [status, track, progress_ms, device]
      properties:
        status:
          type: string
          enum: [playing, paused, nothing_playing, reconnect_needed, not_connected]
          description: '`nothing_playing` also covers podcasts, ads, and local files.'
        track:
          description: Set when `playing` or `paused`.
          oneOf:
            - type: object
              required: [spotify_track_id, title, artists, album_title, cover_url, spotify_url, duration_ms]
              properties:
                spotify_track_id: {type: string}
                title: {type: string}
                artists:
                  type: array
                  description: In credit order.
                  items:
                    type: object
                    required: [spotify_artist_id, name]
                    properties:
                      spotify_artist_id: {type: string}
                      name: {type: string}
                album_title: {type: [string, 'null']}
                cover_url: {type: [string, 'null'], format: uri, description: Spotify album art, shown unaltered.}
                spotify_url: {type: string, format: uri, description: Opens the song on Spotify.}
                duration_ms: {type: [integer, 'null']}
            - {type: 'null'}
        progress_ms: {type: [integer, 'null'], description: Position in the song when Spotify was asked.}
        device:
          description: Where Spotify is playing, when known.
          oneOf:
            - type: object
              required: [name, type]
              properties:
                name: {type: string}
                type: {type: string, description: 'Spotify''s device type, e.g. Smartphone, Computer, Speaker.'}
            - {type: 'null'}
    SpotifyPlay:
      type: object
      properties:
        spotify_track_id:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z]{22}$'
          description: The song to play from the start. Leave it out to resume.
    DeviceRegistration:
      type: object
      required: [push_token, platform]
      properties:
        push_token: {type: string}
        platform: {type: string, enum: [ios, android]}
        app_version: {type: string}
    UploadIntentRequest:
      type: object
      required: [purpose, mime_type, bytes]
      properties:
        purpose: {type: string, enum: [submission, featured_video]}
        mime_type: {type: string, enum: [image/jpeg, image/png, video/mp4], description: 'video/mp4 only for featured_video'}
        bytes: {type: integer, minimum: 1, maximum: 104857600, description: 'Photos up to 15 MB, videos up to 100 MB'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    UploadIntent:
      type: object
      required: [upload_id, method, url, expires_at]
      properties:
        upload_id: {type: string, format: uuid}
        method: {type: string, const: PUT}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
        expires_at: {type: string, format: date-time}

    ArtistStatus:
      type: string
      enum: [onboarding, active, paused]
    ArtistSearchResult:
      type: object
      required: [spotify_artist_id, name, tracked]
      properties:
        spotify_artist_id: {type: string}
        name: {type: string}
        image_url: {type: [string, 'null'], format: uri}
        genres:
          type: array
          items: {type: string}
        tracked: {type: boolean}
        artist_id: {type: [string, 'null'], format: uuid}
        status: {oneOf: [{$ref: '#/components/schemas/ArtistStatus'}, {type: 'null'}]}
        release_count:
          type: [integer, 'null']
          description: |
            The artist's albums, singles, and compilations on Spotify. Set only when another result has the same
            name (Spotify gives apps no follower counts or popularity); null otherwise or if Spotify did not answer.
    Artist:
      type: object
      required: [id, name, spotify_artist_id, status, tracked_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        spotify_artist_id: {type: string}
        image_url: {type: [string, 'null'], format: uri}
        website_url: {type: [string, 'null'], format: uri}
        merch_url: {type: [string, 'null'], format: uri}
        status: {$ref: '#/components/schemas/ArtistStatus'}
        added_by_me: {type: boolean}
        tracked_at: {type: string, format: date-time}
        activated_at: {type: [string, 'null'], format: date-time}
        my_score: {oneOf: [{$ref: '#/components/schemas/ScoreSummary'}, {type: 'null'}]}
    ExportRows:
      type: array
      description: One object per row; the fields are listed in the section's description.
      items: {type: object, additionalProperties: true}
    DataExport:
      type: object
      description: |
        "Download my data" (`GET /me/export`). Timestamps are RFC 3339 UTC. Rows are ordered oldest first unless noted.
        Sections are only ever added within a `format_version`.
      required: [format_version, exported_at, user_id, account, spotify, fandom, journal, activity, proof, social, tickets, notifications]
      properties:
        format_version: {type: integer, const: 1}
        exported_at: {type: string, format: date-time}
        user_id: {type: string, format: uuid}
        account:
          type: object
          required: [profile, sign_in_methods, sessions, hub_cities, push_devices, organizations]
          properties:
            profile:
              type: object
              description: id, handle, email, display_name, avatar_url, is_staff, is_artist, band_url, instagram_handle, x_handle, presale_reminders, push {tickets, presales, staff}, hubs_changed_at, created_at.
              required: [id, handle, email, created_at]
              properties:
                id: {type: string, format: uuid}
                handle: {type: string}
                email: {type: string}
                created_at: {type: string}
              additionalProperties: true
            sign_in_methods:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: provider (apple, google), created_at, last_used_at. Not the provider's account id.
            sessions:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Newest first. created_at, last_refreshed_at, expires_at, revoked_at, revoked_reason, current. No tokens.
            hub_cities:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: position (1 is primary), city_id, name, region, country.
            push_devices:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, platform, created_at, last_seen_at, disabled_at, disabled_reason. Not the push token.
            organizations:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Promoter organizations the caller belongs to. id, name, kind, role, added_at.
        spotify:
          type: object
          required: [connection, artist_signals, saved_tracks, saved_albums, plays]
          properties:
            connection:
              type: [object, 'null']
              description: Null when Spotify isn't connected. spotify_user_id, scopes, connected_at, last_synced_at, sync_state, sync_error, tracked_artists_found, top_artists_added, plays_polled_at. Never the tokens.
              additionalProperties: true
            artist_signals:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Per tracked artist. artist_id, artist_name, liked_tracks, playlist_tracks, distinct_albums, top_artist_rank, top_artist_rank_short, top_artist_rank_long, top_tracks, playlists_featuring, dedicated_playlists, followed, recent_plays, synced_at.
            saved_tracks:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Tracked artists' tracks liked or on the caller's playlists. spotify_track_id, track_title, album_title, artist_name, source (liked, playlist), saved_at.
            saved_albums:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: spotify_album_id, album_title, artist_name, saved_at.
            plays:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Newest first; tracked artists only. played_at, spotify_track_id, track_title, artist_name.
        fandom:
          type: object
          required: [scores, points, share_cards, artists_added, outbound_clicks]
          properties:
            scores:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: artist_id, artist_name, raw_score, percentile, is_estimated, baseline_weight, breakdown, computed_at.
            points:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: The points ledger. id, artist_id, artist_name, rule_key, points, source_type, source_id, awarded_at, reversed_at.
            share_cards:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, artist_name, raw_score, percentile, image_url, shared_to, created_at.
            artists_added:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Artists the caller started tracking. id, name, spotify_artist_id, added_via, tracked_at.
            outbound_clicks:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: artist_name, event_id, kind, partner, clicked_at.
        journal:
          type: object
          required: [album_logs, lists, comments]
          properties:
            album_logs:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Including withdrawn (deleted_at) and taken-down (removed_at) logs. id, album_id, album_title, artist_name, rating (1 to 10 half-stars), review, listened_on, is_relisten, visibility, created_at, updated_at, deleted_at, removed_at.
            lists:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, title, description, visibility, created_at, items [{position, album_id, album_title, note}].
            comments:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, album_log_id, parent_id, body, created_at, edited_at, deleted_at.
        activity:
          type: object
          required: [prompt_answers, trivia, reactions, reports_filed]
          properties:
            prompt_answers:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, prompt_day, prompt, body, visibility, created_at, updated_at, deleted_at, removed_at.
            trivia:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, day, artist_name, kind, prompt, options, answer_index (null until answered), chosen_index, correct, answered_at, created_at.
            reactions:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Reactions the caller gave. target_type, target_id, reaction, created_at.
            reports_filed:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Reports the caller filed (not reports about them). id, target_type, target_id, reason, details, created_at, resolved_at, resolution.
        proof:
          type: object
          required: [submissions, uploads]
          properties:
            submissions:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, artist_id, artist_name, event_id, event_name, kind, status, caption, concert_date, concert_venue, concert_city, rejection_reason, submitted_at, verified_at, rejected_at, archived_at, shared_at, removed_at, files [{id, mime_type, bytes, uploaded_at, redacted, redaction_state, storage_tier, archived_at, url (signed, an hour)}].
            uploads:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Upload records. id, purpose, mime_type, declared_bytes, bytes, created_at, uploaded_at, expires_at, submission_id.
        social:
          type: object
          required: [following, followers, grab_bag]
          properties:
            following:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: handle, followed_at.
            followers:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: handle, followed_at.
            grab_bag:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: position, spotify_track_id, title, artist_name, album_title, cover_url, added_at, refreshed_at.
        tickets:
          type: object
          required: [registrations, guest_of, reservations]
          properties:
            registrations:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, allocation_id, allocation_name, event_id, event_name, event_starts_at, hub_city_ids, hub_match, percentile, raw_score, is_estimated, baseline_weight, score_computed_at, registered_at, withdrawn_at, withdrawn_reason, plus_one, guest_handle, guest_named_at, outcome, selection_rank, seats.
            guest_of:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: Shows another fan named the caller as their +1 for. event_id, event_name, event_starts_at, host_handle, guest_named_at.
            reservations:
              allOf: [{$ref: '#/components/schemas/ExportRows'}]
              description: id, registration_id, allocation_id, event_id, event_name, event_starts_at, seats, face_value_cents, currency, deliver_at, created_at, returned_at, cancelled_at, cancelled_reason. Not the ticket token.
        notifications:
          allOf: [{$ref: '#/components/schemas/ExportRows'}]
          description: Fan notices (not staff notices). id, kind, subject_id, data, created_at, read_at.
    FanLevel:
      type: object
      required: [level, name, max_level, activity, next_level_at, next_level_name, parts]
      properties:
        level: {type: integer, minimum: 1, maximum: 10}
        name: {type: string, description: 'e.g. "Front Row"'}
        next_level_name: {type: [string, 'null'], description: The next level's name; null at Superstar.}
        max_level: {type: integer}
        activity: {type: number, minimum: 0, maximum: 1}
        next_level_at: {type: [number, 'null'], description: The activity the next level starts at; null at the top level.}
        parts:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: {type: string, enum: [fandom, albums_logged, verified_proof, trivia, prompts]}
              value: {type: number, minimum: 0, maximum: 1}
    ScoreCardLink:
      type: object
      required: [image_url, share_text, top_label, is_estimated, expires_at]
      properties:
        image_url: {type: string, format: uri, description: Signed; works without sign-in until expires_at.}
        share_text: {type: string, description: 'e.g. "I''m in the top 3% of Geese fans on Fandom Score."'}
        top_label: {type: string, description: '"Top 3%", as on the card.'}
        is_estimated: {type: boolean}
        expires_at: {type: string, format: date-time}
    PushSettings:
      type: object
      description: Which notifications also go to the fan's phones. All on by default; in-app notifications are kept either way.
      required: [tickets, presales, staff]
      properties:
        tickets: {type: boolean, description: 'Draw results, seats that open up, delivered tickets.'}
        presales: {type: boolean, description: Presale reminders.}
        staff: {type: boolean, description: Staff notices (staff accounts only).}
    PushDevice:
      type: object
      required: [id, platform, created_at, last_seen_at]
      properties:
        id: {type: string, format: uuid}
        platform: {type: string, enum: [ios, android]}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
    ArtistSource:
      type: object
      required: [source, external_id, matched_by, checked_at, synced_at]
      properties:
        source: {type: string, enum: [ticketmaster]}
        external_id: {type: [string, 'null']}
        matched_by: {type: [string, 'null'], enum: [spotify_link, staff, null]}
        checked_at: {type: string, format: date-time}
        synced_at: {type: [string, 'null'], format: date-time, description: Last time the artist's shows were loaded.}
    RedactionReview:
      type: object
      required: [file_id, submission_id, kind, artist, user, note, codes_redacted, uploaded_at, deleted_after, file]
      properties:
        file_id: {type: string, format: uuid}
        submission_id: {type: string, format: uuid}
        kind: {type: string, enum: [ticket, merch, screenshot, concert_photo]}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        user: {$ref: '#/components/schemas/UserRef'}
        note: {type: [string, 'null'], description: Why the worker couldn't finish the file.}
        codes_redacted: {type: integer, minimum: 0, description: Codes the worker found and blacked out before sending the file to staff.}
        uploaded_at: {type: string, format: date-time}
        deleted_after: {type: string, format: date-time, description: When the quarantine bucket deletes the original.}
        file:
          type: object
          description: The quarantined original (a short-lived signed link).
          required: [id, mime_type, url, redacted]
          properties:
            id: {type: string, format: uuid}
            mime_type: {type: string}
            url: {type: string, format: uri}
            redacted: {type: boolean}
    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        image_url: {type: [string, 'null'], format: uri}
    ArtistPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Artist'}
        next_cursor: {type: [string, 'null']}
    ArtistStats:
      type: object
      required: [artist_id, scored_users, baseline_weight, is_estimated, histogram]
      properties:
        artist_id: {type: string, format: uuid}
        scored_users: {type: integer}
        baseline_weight:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the percentile still coming from the synthetic baseline.
        is_estimated: {type: boolean}
        histogram:
          type: array
          items:
            type: object
            required: [from, to, share]
            properties:
              from: {type: number}
              to: {type: number}
              share: {type: number}
    Event:
      type: object
      description: |
        A show. Staff enter some; the rest come from Ticketmaster (`source: ticketmaster`, loaded daily for tracked
        artists), with its ticket link, status, public sale, and presales. A show with a fan allocation keeps the time
        and city staff set even if Ticketmaster changes them.
      required: [id, artist_id, name, starts_at, tickets_available, source, ticket_url, status, time_tba,
                 public_sale_starts_at, public_sale_ends_at, presales]
      properties:
        id: {type: string, format: uuid}
        artist_id: {type: string, format: uuid}
        name: {type: string}
        venue: {type: [string, 'null']}
        city_id: {type: [string, 'null'], description: 'The hub city (`HubCity.id`); null for shows not entered by staff'}
        city: {type: [string, 'null']}
        region: {type: [string, 'null']}
        country: {type: [string, 'null']}
        time_zone:
          type: [string, 'null']
          description: The hub city's IANA time zone, for showing the show's time and registration window locally. Null without a hub city.
        starts_at: {type: string, format: date-time, description: 'With `time_tba`, local midnight of the show''s date.'}
        tickets_available: {type: boolean, description: A fan allocation is open or upcoming for this show.}
        source: {type: [string, 'null'], enum: [ticketmaster, null], description: Null for shows staff entered.}
        ticket_url: {type: [string, 'null'], format: uri, description: Where the public buys tickets (Ticketmaster's event page).}
        status:
          type: string
          enum: [scheduled, onsale, offsale, cancelled, postponed, rescheduled]
          description: Ticketmaster's status; `scheduled` for staff-entered shows.
        time_tba: {type: boolean, description: Only the date is known.}
        public_sale_starts_at: {type: [string, 'null'], format: date-time}
        public_sale_ends_at: {type: [string, 'null'], format: date-time}
        presales:
          type: array
          description: Presales that haven't ended, earliest first.
          items:
            type: object
            required: [name, starts_at, ends_at]
            properties:
              name: {type: string, description: 'As Ticketmaster names it, e.g. "Verified Fan Presale".'}
              starts_at: {type: string, format: date-time}
              ends_at: {type: [string, 'null'], format: date-time}
    EventDetail:
      type: object
      required: [event, allocations]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        allocations:
          type: array
          items: {$ref: '#/components/schemas/Allocation'}
    EventCreate:
      type: object
      required: [artist_id, name, city_id, starts_at]
      properties:
        artist_id: {type: string, format: uuid}
        name: {type: string, maxLength: 200}
        venue: {type: [string, 'null'], maxLength: 200}
        city_id: {type: string}
        starts_at: {type: string, format: date-time}
        organization_id:
          type: [string, 'null']
          format: uuid
          description: Staff only (`POST /admin/events`), the promoter organization that manages the show; omit for a staff-managed show. Ignored under `/organizations/{organizationId}`.
    EventUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        venue: {type: [string, 'null'], maxLength: 200}
        city_id: {type: string}
        starts_at: {type: string, format: date-time}
    Allocation:
      type: object
      description: |
        Face-value tickets set aside for top fans of the show's artist: one seat per selected fan, two with a +1.
        Fans whose raw score for the artist is at least `min_raw_score` can register while registration is open.
      required: [id, event_id, name, tickets, face_value_cents, currency, min_raw_score, registration_opens_at,
                 registration_closes_at, status, delivery_hours_before_show]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        name: {type: string}
        tickets: {type: integer, minimum: 1}
        face_value_cents: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        min_raw_score:
          type: [number, 'null']
          minimum: 0
          description: |
            Null only on a draft without one: publishing sets the raw score of a fan with two saved albums by the
            artist. Locks once registration opens.
        registration_opens_at: {type: string, format: date-time}
        registration_closes_at: {type: string, format: date-time}
        status:
          type: string
          enum: [draft, upcoming, open, closed, selected, cancelled]
          description: |
            `draft` is staff-only; `upcoming` is published but not open yet; `closed` means registration is over;
            `selected` means the draw has run
        published_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        selected_at: {type: [string, 'null'], format: date-time}
        seats_left: {type: [integer, 'null'], minimum: 0, description: 'After the draw: seats a selected fan''s +1 can still take'}
        delivery_hours_before_show:
          type: integer
          minimum: 0
          description: Tickets are delivered this many hours before the show (24 by default). Locks with the other rules.
    Registration:
      type: object
      description: A fan's registration, with the snapshot taken when they registered.
      required: [id, allocation_id, event_id, hub_city_ids, local, percentile, raw_score, is_estimated, registered_at, status,
                 plus_one, reservation_id, reservation_status]
      properties:
        id: {type: string, format: uuid}
        allocation_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        hub_city_ids:
          type: array
          items: {type: string}
          description: The fan's hub cities when they registered, primary first
        hub_match:
          type: [integer, 'null']
          minimum: 1
          maximum: 3
          description: Position of the show's city in `hub_city_ids` (1 is the primary city); null if none
        local: {type: boolean, description: The show's city is one of the fan's hub cities}
        percentile: {type: number}
        raw_score: {type: number}
        is_estimated: {type: boolean}
        registered_at: {type: string, format: date-time}
        withdrawn_at: {type: [string, 'null'], format: date-time}
        status:
          type: string
          enum: [registered, withdrawn, selected, not_selected, returned]
          description: '`selected` and `not_selected` come from the draw; `returned`: the fan gave their reservation back'
        plus_one: {type: boolean, description: The fan asked for a +1}
        guest:
          description: The +1's account, once named
          oneOf:
            - type: object
              required: [id, handle]
              properties:
                id: {type: string, format: uuid}
                handle: {type: string}
            - {type: 'null'}
        selection_rank: {type: [integer, 'null'], minimum: 1, description: Place in the draw's ranking}
        seats: {type: [integer, 'null'], enum: [1, 2, null], description: 'Seats the draw gave: 1, or 2 with the +1'}
        reservation_id: {type: [string, 'null'], format: uuid, description: Set once selected (see Reservation).}
        reservation_status:
          type: [string, 'null']
          enum: [held, delivered, returned, cancelled, null]
    Eligibility:
      type: object
      required: [allocation_id, eligible, min_raw_score]
      properties:
        allocation_id: {type: string, format: uuid}
        eligible: {type: boolean, description: 'True if the fan can register now, or already has'}
        reason:
          type: [string, 'null']
          enum: [not_open, artist_not_active, hub_city_required, no_score, below_threshold, already_registered, named_as_guest, null]
        min_raw_score: {type: [number, 'null']}
        raw_score: {type: [number, 'null']}
        percentile: {type: [number, 'null']}
        is_estimated: {type: [boolean, 'null']}
        hub_match: {type: [integer, 'null'], minimum: 1, maximum: 3}
        registration:
          oneOf: [{$ref: '#/components/schemas/Registration'}, {type: 'null'}]
        standing:
          oneOf: [{$ref: '#/components/schemas/Standing'}, {type: 'null'}]
    Standing:
      type: object
      description: Where the fan would place if the draw ran now. Equal scores count as ahead of the fan.
      required: [rank, registrants, top_percent, seats_ahead, seats_needed, tickets, margin_seats, local, likely]
      properties:
        rank: {type: integer, minimum: 1}
        registrants: {type: integer, minimum: 1, description: Live registrations including the fan's (or theirs-to-be)}
        top_percent: {type: integer, minimum: 1, maximum: 100, description: 'The fan is in the top this-many percent of registrants'}
        seats_ahead: {type: integer, minimum: 0, description: Seats the fans ranked ahead would take (2 each with a +1)}
        seats_needed: {type: integer, enum: [1, 2]}
        tickets: {type: integer}
        margin_seats: {type: integer, description: Seats held back before saying likely}
        local: {type: boolean, description: The show's city is one of the fan's hub cities (local fans are ranked first)}
        likely: {type: boolean, description: '`seats_ahead + seats_needed <= tickets - margin_seats`'}
    MyRegistration:
      type: object
      required: [registration, allocation, event]
      properties:
        registration: {$ref: '#/components/schemas/Registration'}
        allocation: {$ref: '#/components/schemas/Allocation'}
        event: {$ref: '#/components/schemas/Event'}
    Notification:
      type: object
      required: [id, kind, title, body, link, created_at, read, data]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [draw_selected, draw_not_selected, seat_backfilled, ticket_delivered, presale, guest_named, staff_report, staff_review, staff_draw, staff_redaction, staff_show_changed]
        title: {type: string}
        body: {type: string}
        link: {type: string, description: 'App route to open, e.g. /tickets or /show/{id}'}
        created_at: {type: string, format: date-time}
        read: {type: boolean}
        data: {type: object, additionalProperties: true, description: What the text was made from (ids, show name, counts).}
    NotificationPage:
      type: object
      required: [items, unread_count, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        unread_count: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null']}
    Reservation:
      type: object
      description: |
        A selected fan's seats at face value (migration 0020). `status`: `held` (a seat is theirs; the ticket arrives
        at `deliver_at`), `delivered`, `returned`, or `cancelled`. `role`: `holder`, or `guest` (the named +1).
        `ticket` is set for the holder once delivered; `can_return` while the holder can still give it back.
      required: [id, allocation_id, event_id, registration_id, status, role, seats, face_value_cents, currency, deliver_at,
                 created_at, returned_at, cancelled_at, cancelled_reason, holder_handle, guest_handle, can_return, ticket, event,
                 artist, allocation_name]
      properties:
        id: {type: string, format: uuid}
        allocation_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        registration_id: {type: string, format: uuid}
        status: {type: string, enum: [held, delivered, returned, cancelled]}
        role: {type: string, enum: [holder, guest]}
        seats: {type: integer, enum: [1, 2]}
        face_value_cents: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        deliver_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        returned_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancelled_reason: {type: [string, 'null'], enum: [account_deleted, show_cancelled, null]}
        holder_handle: {type: string}
        guest_handle: {type: [string, 'null'], description: The named +1, when they still have an account.}
        can_return: {type: boolean}
        ticket:
          oneOf:
            - type: object
              description: Shown at the door. Never transferable; the API gives it to the holder only.
              required: [token, holder_handle, guest_handle]
              properties:
                token: {type: string, pattern: '^[0-9a-f]{64}$'}
                holder_handle: {type: string}
                guest_handle: {type: [string, 'null']}
            - {type: 'null'}
        event: {$ref: '#/components/schemas/Event'}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        allocation_name: {type: string}
    AllocationCreate:
      type: object
      required: [tickets, face_value_cents, registration_opens_at, registration_closes_at]
      properties:
        name: {type: string, maxLength: 100, default: Fan allocation}
        tickets: {type: integer, minimum: 1, maximum: 100000}
        face_value_cents: {type: integer, minimum: 0, maximum: 10000000}
        currency: {type: string, pattern: '^[A-Z]{3}$', default: USD}
        min_raw_score:
          type: number
          minimum: 0
          description: Omit to get the two-saved-albums default when the allocation is published
        registration_opens_at: {type: string, format: date-time}
        registration_closes_at: {type: string, format: date-time, description: Before the show starts}
        delivery_hours_before_show:
          type: integer
          minimum: 0
          maximum: 720
          default: 24
          description: Tickets are delivered this many hours before the show
    AllocationUpdate:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        tickets: {type: integer, minimum: 1, maximum: 100000}
        face_value_cents: {type: integer, minimum: 0, maximum: 10000000}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        min_raw_score: {type: number, minimum: 0}
        registration_opens_at: {type: string, format: date-time}
        registration_closes_at: {type: string, format: date-time}
        delivery_hours_before_show: {type: integer, minimum: 0, maximum: 720}
    DrawStatus:
      type: object
      description: Where an allocation's draw stands. It runs as a background job once staff queue it.
      required: [allocation_id, status, queued_at, error, selection]
      properties:
        allocation_id: {type: string, format: uuid}
        status:
          type: string
          enum: [not_run, queued, running, failed, done]
          description: '`failed`: the worker gave up (`error` says why); queue it again to retry. `done`: see `selection`.'
        queued_at: {type: [string, 'null'], format: date-time, description: When the current job was queued; null when not_run or done.}
        error: {type: [string, 'null'], description: The last error, when `failed`.}
        selection:
          oneOf: [{$ref: '#/components/schemas/Selection'}, {type: 'null'}]
          description: The recorded draw, when `done`.
    Selection:
      type: object
      description: A recorded draw. With the registrations' snapshots, `seed` is enough to repeat it.
      required: [allocation_id, seed, tickets, registrations, selected_fans, seats_assigned, ran_at]
      properties:
        allocation_id: {type: string, format: uuid}
        seed: {type: string}
        tickets: {type: integer}
        registrations: {type: integer, description: Live registrations in the draw}
        selected_fans: {type: integer}
        seats_assigned: {type: integer, description: Grows when a selected fan adds a +1 afterwards}
        ran_at: {type: string, format: date-time}
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Event'}
        next_cursor: {type: [string, 'null']}

    ScoreSummary:
      type: object
      required: [artist_id, artist, percentile, raw_score, is_estimated, computed_at]
      properties:
        artist_id: {type: string, format: uuid}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        percentile: {type: number, minimum: 0, maximum: 100}
        raw_score: {type: number}
        is_estimated: {type: boolean}
        computed_at: {type: string, format: date-time}
    UserStats:
      type: object
      required: [artists, listening, journal, proof, ledger_points]
      properties:
        artists:
          type: array
          description: Best percentile first.
          items:
            type: object
            required: [artist, raw_score, percentile, rank, fans, is_estimated, computed_at]
            properties:
              artist: {$ref: '#/components/schemas/ArtistRef'}
              raw_score: {type: number}
              percentile: {type: number, minimum: 0, maximum: 100}
              rank: {type: integer, minimum: 1, description: 'Among the artist''s scored fans; ties share the better rank'}
              fans: {type: integer, minimum: 1, description: Scored fans of the artist}
              is_estimated: {type: boolean}
              computed_at: {type: string, format: date-time}
        listening:
          type: object
          required: [artists, liked_tracks, playlist_tracks, distinct_albums, recent_plays, saved_albums, top_tracks, followed_artists, plays_last_quarter]
          properties:
            artists: {type: integer, description: Active tracked artists the fan has Spotify signals for}
            liked_tracks: {type: integer}
            playlist_tracks: {type: integer}
            distinct_albums: {type: integer}
            recent_plays: {type: integer, description: Plays of tracked artists among the fan's last 50 at the last sync}
            saved_albums: {type: integer, description: Tracked artists' albums in the fan's saved albums}
            top_tracks: {type: integer, description: Tracked artists' tracks among the fan's Spotify top tracks}
            followed_artists: {type: integer, description: Tracked artists the fan follows on Spotify}
            plays_last_quarter: {type: integer, description: 'Plays of tracked artists in the last 90 days (play ledger, polled hourly)'}
        journal:
          type: object
          required: [logs, albums_logged, relistens, reviews, ratings, lists, comments]
          properties:
            logs: {type: integer}
            albums_logged: {type: integer, description: Distinct albums}
            relistens: {type: integer}
            reviews: {type: integer}
            ratings: {type: integer}
            lists: {type: integer}
            comments: {type: integer}
        proof:
          type: object
          required: [tickets, merch, screenshots]
          description: Verified submissions only.
          properties:
            tickets: {type: integer}
            merch: {type: integer}
            screenshots: {type: integer}
        ledger_points: {type: number}
    ProfileStats:
      type: object
      description: A fan's fandom stats as their followers see them. Listening counts stay private.
      required: [artists, journal, proof, ledger_points]
      properties:
        artists:
          type: array
          description: Best percentile first.
          items:
            type: object
            required: [artist, raw_score, percentile, rank, fans, is_estimated, computed_at]
            properties:
              artist: {$ref: '#/components/schemas/ArtistRef'}
              raw_score: {type: number}
              percentile: {type: number, minimum: 0, maximum: 100}
              rank: {type: integer, minimum: 1, description: 'Among the artist''s scored fans; ties share the better rank'}
              fans: {type: integer, minimum: 1, description: Scored fans of the artist}
              is_estimated: {type: boolean}
              computed_at: {type: string, format: date-time}
        journal:
          type: object
          required: [logs, albums_logged, relistens, reviews, ratings, lists, comments]
          properties:
            logs: {type: integer}
            albums_logged: {type: integer, description: Distinct albums}
            relistens: {type: integer}
            reviews: {type: integer}
            ratings: {type: integer}
            lists: {type: integer}
            comments: {type: integer}
        proof:
          type: object
          required: [tickets, merch, screenshots]
          description: Verified submissions only.
          properties:
            tickets: {type: integer}
            merch: {type: integer}
            screenshots: {type: integer}
        ledger_points: {type: number}
    ScoreSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ScoreSummary'}
        next_cursor: {type: [string, 'null']}
    Score:
      type: object
      required: [artist_id, status]
      properties:
        artist_id: {type: string, format: uuid}
        status: {type: string, enum: [ready, computing, artist_onboarding]}
        percentile: {type: [number, 'null'], minimum: 0, maximum: 100}
        raw_score: {type: [number, 'null']}
        is_estimated: {type: boolean}
        baseline_weight: {type: [number, 'null']}
        computed_at: {type: [string, 'null'], format: date-time}
        breakdown:
          type: [object, 'null']
          description: |
            Stored as JSON by the scoring worker; shape below is the current contract. Each Spotify signal earns a
            share from 0 to 1 (null when its rule is disabled); `spotify.points` (0 to 100) is the shares weighted by
            the Spotify rules in `scoring_rules`. `total` adds ledger points (journal, proof of fandom).
          properties:
            spotify:
              type: object
              description: Counts behind each share (workers/scoring/README.md lists the rule for each).
              properties:
                liked_tracks: {type: integer}
                playlist_tracks: {type: integer}
                distinct_albums: {type: integer}
                top_artist_rank: {type: [integer, 'null'], description: Rank in the fan's top artists of the last 6 months}
                recent_plays: {type: integer}
                top_artist_rank_short: {type: [integer, 'null'], description: Rank over the last 4 weeks}
                top_artist_rank_long: {type: [integer, 'null'], description: Rank over the fan's history}
                top_tracks: {type: integer}
                saved_albums: {type: integer}
                early_saves: {type: integer, description: Releases saved within a week of release day}
                first_saved_at: {type: [string, 'null'], format: date-time}
                tenure_days: {type: integer}
                playlists_featuring: {type: integer}
                dedicated_playlists: {type: integer}
                followed: {type: boolean}
                plays_last_quarter: {type: integer, description: Plays in the last 90 days}
                streak_weeks: {type: integer}
                tracks_touched: {type: integer, description: 'Catalog tracks saved, in a playlist, or played'}
                deep_cuts: {type: integer}
                catalog_releases: {type: integer}
                catalog_tracks: {type: integer}
                shares:
                  type: object
                  properties:
                    liked: {type: [number, 'null']}
                    playlist: {type: [number, 'null']}
                    album_depth: {type: [number, 'null']}
                    top_artist: {type: [number, 'null']}
                    recent: {type: [number, 'null']}
                    top_artist_short: {type: [number, 'null']}
                    top_artist_long: {type: [number, 'null']}
                    top_track: {type: [number, 'null']}
                    saved_album: {type: [number, 'null']}
                    early_save: {type: [number, 'null']}
                    tenure: {type: [number, 'null']}
                    playlist_feature: {type: [number, 'null']}
                    dedicated_playlist: {type: [number, 'null']}
                    follow: {type: [number, 'null']}
                    play_history: {type: [number, 'null']}
                    play_streak: {type: [number, 'null']}
                    catalog_coverage: {type: [number, 'null']}
                    deep_cut: {type: [number, 'null']}
                points: {type: number}
            ledger_points: {type: number}
            total: {type: number}

    Track:
      type: object
      required: [id, title, disc_number]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        track_number: {type: [integer, 'null']}
        disc_number: {type: integer}
        spotify_track_id: {type: [string, 'null'], description: For the link to Spotify (ADR 0006).}
    AlbumType:
      type: string
      enum: [album, single, compilation]
    Album:
      type: object
      required: [id, artist, title, album_type, release_date_precision, delisted]
      properties:
        id: {type: string, format: uuid}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        title: {type: string}
        album_type: {$ref: '#/components/schemas/AlbumType'}
        release_date: {type: [string, 'null'], format: date, description: The first day of the period when precision is year or month.}
        release_date_precision: {type: string, enum: [year, month, day]}
        cover_url:
          type: [string, 'null']
          format: uri
          description: |
            Spotify's cover image, to show unaltered next to the Spotify logo and a link to the album
            (`https://open.spotify.com/album/{spotify_album_id}`). Null when there is none or the album is delisted.
        spotify_album_id: {type: [string, 'null'], description: Null once the album is delisted.}
        delisted: {type: boolean, description: Spotify no longer lists this release; it stays for existing logs.}
        community:
          type: object
          properties:
            log_count: {type: integer}
            average_rating:
              type: [number, 'null']
              description: 0.5 to 5.0
    AlbumRef:
      type: object
      required: [id, title, album_type]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        album_type: {$ref: '#/components/schemas/AlbumType'}
        cover_url: {type: [string, 'null'], format: uri}
        spotify_album_id: {type: [string, 'null']}
        artist: {$ref: '#/components/schemas/ArtistRef'}
    AlbumDetail:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          properties:
            tracks:
              type: array
              items: {$ref: '#/components/schemas/Track'}
            my_latest_log: {oneOf: [{$ref: '#/components/schemas/AlbumLog'}, {type: 'null'}]}
    AlbumPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Album'}
        next_cursor: {type: [string, 'null']}

    Visibility:
      type: string
      enum: [public, followers, private]
    AlbumLog:
      type: object
      required: [id, user, album, listened_on, is_relisten, visibility, created_at]
      properties:
        id: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/UserRef'}
        album: {$ref: '#/components/schemas/AlbumRef'}
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 10
          description: Half-star steps; 1 is 0.5 stars and 10 is 5.0 stars.
        review: {type: [string, 'null'], maxLength: 10000}
        listened_on: {type: string, format: date}
        is_relisten: {type: boolean}
        visibility: {$ref: '#/components/schemas/Visibility'}
        comment_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LogCreate:
      type: object
      required: [album_id]
      properties:
        album_id: {type: string, format: uuid}
        rating: {type: integer, minimum: 1, maximum: 10}
        review: {type: string, maxLength: 10000}
        listened_on: {type: string, format: date, description: Defaults to today (user's local date).}
        visibility: {$ref: '#/components/schemas/Visibility'}
    LogUpdate:
      type: object
      properties:
        rating: {type: [integer, 'null'], minimum: 1, maximum: 10}
        review: {type: [string, 'null'], maxLength: 10000}
        listened_on: {type: string, format: date}
        visibility: {$ref: '#/components/schemas/Visibility'}
    LogResult:
      type: object
      required: [log, points_awarded]
      properties:
        log: {$ref: '#/components/schemas/AlbumLog'}
        points_awarded:
          type: array
          items: {$ref: '#/components/schemas/PointsAward'}
    LogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AlbumLog'}
        next_cursor: {type: [string, 'null']}

    Comment:
      type: object
      required: [id, log_id, user, deleted, created_at]
      properties:
        id: {type: string, format: uuid}
        log_id: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/UserRef'}
        parent_id: {type: [string, 'null'], format: uuid}
        body: {type: [string, 'null'], description: Null for deleted tombstones.}
        deleted: {type: boolean}
        created_at: {type: string, format: date-time}
        edited_at: {type: [string, 'null'], format: date-time}
    CommentCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 2000}
        parent_id: {type: string, format: uuid}
    CommentResult:
      type: object
      required: [comment, points_awarded]
      properties:
        comment: {$ref: '#/components/schemas/Comment'}
        points_awarded:
          type: array
          items: {$ref: '#/components/schemas/PointsAward'}
    CommentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Comment'}
        next_cursor: {type: [string, 'null']}

    ListWrite:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, 'null'], maxLength: 2000}
        visibility: {$ref: '#/components/schemas/Visibility'}
    AlbumList:
      type: object
      required: [id, user, title, visibility, item_count, created_at]
      properties:
        id: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/UserRef'}
        title: {type: string}
        description: {type: [string, 'null']}
        visibility: {$ref: '#/components/schemas/Visibility'}
        item_count: {type: integer}
        created_at: {type: string, format: date-time}
    AlbumListDetail:
      allOf:
        - $ref: '#/components/schemas/AlbumList'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                required: [album, position]
                properties:
                  album: {$ref: '#/components/schemas/AlbumRef'}
                  position: {type: integer}
                  note: {type: [string, 'null']}
    ListPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AlbumList'}
        next_cursor: {type: [string, 'null']}

    SubmissionKind:
      type: string
      enum: [ticket, merch, screenshot, concert_photo]
    SubmissionStatus:
      type: string
      enum: [pending, processing, needs_review, verified, rejected]
    SubmissionCreate:
      type: object
      required: [artist_id, kind, upload_ids]
      properties:
        artist_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/SubmissionKind'}
        upload_ids:
          type: array
          minItems: 1
          maxItems: 5
          items: {type: string, format: uuid}
        event_id:
          type: string
          format: uuid
          description: |
            The show, from `GET /artists/{artistId}/events?include_past=true`: one of this artist's shows that has
            already happened. A concert photo needs `event_id` or `concert`; a ticket may name its show.
        concert:
          type: object
          description: For a concert photo whose show isn't listed. Not with `event_id`; not for other kinds.
          required: [date, venue, city]
          properties:
            date: {type: string, format: date, description: Not in the future.}
            venue: {type: string, minLength: 1, maxLength: 200}
            city: {type: string, minLength: 1, maxLength: 100}
        client_extracted:
          type: object
          description: Optional on-device OCR output. Treated as untrusted. Not used yet.
          additionalProperties: true
        caption: {type: [string, 'null'], maxLength: 500, description: Shown on the feed if the photo is shared.}
    Submission:
      type: object
      required: [id, artist_id, artist, kind, status, submitted_at, can_share, removed]
      properties:
        id: {type: string, format: uuid}
        artist_id: {type: string, format: uuid}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        concert:
          type: [object, 'null']
          description: The show the fan entered because it wasn't listed (otherwise see `event`).
          required: [date, venue, city]
          properties:
            date: {type: string, format: date}
            venue: {type: string}
            city: {type: string}
        caption: {type: [string, 'null']}
        shared_at: {type: [string, 'null'], format: date-time, description: On the home feed since; null when not shared.}
        can_share: {type: boolean, description: Verified merch or concert photo that staff haven't taken down.}
        removed: {type: boolean, description: Staff took it off the feed after a report; it stays as proof.}
        kind: {$ref: '#/components/schemas/SubmissionKind'}
        status: {$ref: '#/components/schemas/SubmissionStatus'}
        event: {oneOf: [{$ref: '#/components/schemas/EventRef'}, {type: 'null'}]}
        rejection_reason: {type: [string, 'null']}
        submitted_at: {type: string, format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
        archived: {type: boolean}
        files:
          type: array
          items:
            type: object
            required: [id, mime_type, url, redacted]
            properties:
              id: {type: string, format: uuid}
              mime_type: {type: string}
              url: {type: string, format: uri, description: Short-lived signed URL.}
              redacted: {type: boolean}
        points_awarded:
          type: array
          items: {$ref: '#/components/schemas/PointsAward'}
    EventRef:
      type: object
      required: [id, name, starts_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        venue: {type: [string, 'null']}
        city: {type: [string, 'null']}
        starts_at: {type: string, format: date-time}
    FeedPage:
      type: object
      required: [items, next_cursor, seed]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/FeedItem'}
        next_cursor: {type: [string, 'null']}
        seed: {type: string, description: The shuffle key this page used; send it back with `cursor`.}
    FeedItem:
      type: object
      description: '`type` says which payload is set: `photo`, `log`, `grab_bag`, `concert`, `registration`, `stat`, or `prompt_answer`.'
      required: [type, id, at, user, artist, following]
      properties:
        user_level:
          type: [integer, 'null']
          minimum: 1
          maximum: 10
          description: The author's fan level, when the caller is the author or follows them; otherwise absent or null.
        user_level_name: {type: [string, 'null'], description: 'The level''s name, e.g. "Front Row".'}
        type: {type: string, enum: [photo, album_log, grab_bag, concert, registration, stat, prompt_answer]}
        id:
          type: string
          format: uuid
          description: The submission, album log, grab-bag song, show, or registration id; a stable id for a stat.
        at: {type: string, format: date-time, description: 'When it happened: shared, logged, added, registered; a show''s start.'}
        user:
          description: Whose item it is; null for a show.
          oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]
        artist:
          description: The artist it is about; null for a stat that spans artists.
          oneOf: [{$ref: '#/components/schemas/ArtistRef'}, {type: 'null'}]
        following: {type: boolean, description: The caller follows `user`.}
        grab_bag:
          description: A song from a followed fan's grab bag.
          oneOf: [{$ref: '#/components/schemas/GrabBagSong'}, {type: 'null'}]
        concert:
          description: An upcoming show, with the fan allocation to register for if there is one.
          oneOf: [{$ref: '#/components/schemas/FeedShow'}, {type: 'null'}]
        registration:
          description: The caller's own live registration and standing.
          oneOf: [{$ref: '#/components/schemas/RegistrationCard'}, {type: 'null'}]
        stat:
          description: A number from a followed fan.
          oneOf: [{$ref: '#/components/schemas/FeedStat'}, {type: 'null'}]
        reactions:
          description: Emoji reactions, for posts (photo, album_log, prompt_answer); null for other items.
          type: [array, 'null']
          items: {$ref: '#/components/schemas/ReactionCount'}
        prompt_answer:
          description: An answer to a music prompt from the last week (everyone's public ones; followers-only from people the caller follows).
          type: [object, 'null']
          required: [prompt_id, prompt_text, day, body, visibility]
          properties:
            prompt_id: {type: string, format: uuid}
            prompt_text: {type: string}
            day: {type: string, format: date}
            body: {type: string}
            visibility: {type: string, enum: [public, followers]}
        photo:
          type: [object, 'null']
          required: [kind, files]
          properties:
            kind: {type: string, enum: [merch, concert_photo]}
            caption: {type: [string, 'null']}
            concert:
              type: [object, 'null']
              description: Where a concert photo was taken; `name` is set when it was a listed show.
              required: [date]
              properties:
                name: {type: [string, 'null']}
                venue: {type: [string, 'null']}
                city: {type: [string, 'null']}
                date: {type: string, format: date}
            files:
              type: array
              items:
                type: object
                required: [id, mime_type, url, redacted]
                properties:
                  id: {type: string, format: uuid}
                  mime_type: {type: string}
                  url: {type: string, format: uri, description: Short-lived signed URL.}
                  redacted: {type: boolean}
        log:
          type: [object, 'null']
          required: [album, review_truncated, is_relisten, listened_on]
          properties:
            album:
              type: object
              required: [id, title]
              properties:
                id: {type: string, format: uuid}
                title: {type: string}
                cover_url: {type: [string, 'null'], format: uri}
            rating: {type: [integer, 'null'], minimum: 1, maximum: 10}
            review: {type: [string, 'null'], description: 'At most 280 characters; a longer review is cut and ends with "…".'}
            review_truncated: {type: boolean}
            is_relisten: {type: boolean}
            listened_on: {type: string, format: date}
            visibility: {$ref: '#/components/schemas/Visibility'}
    FeedShow:
      type: object
      required: [event, allocation, registered]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        allocation:
          description: 'The allocation fans can register for, or will be able to: published, not cancelled, not closed.'
          oneOf: [{$ref: '#/components/schemas/Allocation'}, {type: 'null'}]
        registered: {type: boolean, description: The caller holds a live registration for this show.}
    RegistrationCard:
      type: object
      required: [registration, allocation, event, standing]
      properties:
        registration: {$ref: '#/components/schemas/Registration'}
        allocation: {$ref: '#/components/schemas/Allocation'}
        event: {$ref: '#/components/schemas/Event'}
        standing:
          description: Set while registration is upcoming or open.
          oneOf: [{$ref: '#/components/schemas/Standing'}, {type: 'null'}]
    FeedStat:
      type: object
      description: |
        `top_fan`: the fan's place among the artist's fans here (`rank` of `fans`, `percentile`, `value` is their raw
        score). `albums_logged`, `concert_photos`, `merch`: a count in `value`. `points`: ledger points in `value`.
      required: [kind, value]
      properties:
        kind: {type: string, enum: [top_fan, albums_logged, concert_photos, merch, points]}
        value: {type: number}
        percentile: {type: [number, 'null']}
        rank: {type: [integer, 'null'], minimum: 1}
        fans: {type: [integer, 'null'], minimum: 1}
        is_estimated: {type: [boolean, 'null']}
    UserSummary:
      type: object
      description: Another fan in a list, and how they and the caller relate.
      required: [handle, deleted, display_name, avatar_url, followed_by_me, follows_me]
      properties:
        handle: {type: string}
        deleted: {type: boolean}
        display_name: {type: [string, 'null']}
        avatar_url: {type: [string, 'null'], format: uri}
        followed_by_me: {type: boolean}
        follows_me: {type: boolean}
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserSummary'}
        next_cursor: {type: [string, 'null']}
    GrabBagSong:
      type: object
      required: [id, position, spotify_track_id, title, artist, artist_status, album_title, cover_url, spotify_url, added_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1, maximum: 5, description: The slot.}
        spotify_track_id: {type: string}
        title: {type: string}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        artist_status: {$ref: '#/components/schemas/ArtistStatus'}
        album_title: {type: [string, 'null']}
        cover_url: {type: [string, 'null'], format: uri, description: Spotify album art, shown unaltered.}
        spotify_url: {type: string, format: uri, description: Opens the song on Spotify.}
        added_at: {type: string, format: date-time}
    GrabBag:
      type: object
      required: [owner, items, slots]
      properties:
        owner: {$ref: '#/components/schemas/UserRef'}
        items:
          type: array
          description: Filled slots, in slot order.
          items: {$ref: '#/components/schemas/GrabBagSong'}
        slots: {type: integer, description: How many slots a grab bag has (5).}
    BouncerDoor:
      type: object
      required: [song, owner, following, songs]
      properties:
        song:
          description: Null when the caller follows nobody, or nobody they follow has songs.
          oneOf: [{$ref: '#/components/schemas/GrabBagSong'}, {type: 'null'}]
        owner:
          description: Whose grab bag the song came from.
          oneOf: [{$ref: '#/components/schemas/UserRef'}, {type: 'null'}]
        following: {type: integer, description: Fans the caller follows.}
        songs: {type: integer, description: Songs in their grab bags, all together.}
    ReactionCount:
      type: object
      required: [reaction, count, mine]
      properties:
        reaction: {$ref: '#/components/schemas/Reaction'}
        count: {type: integer, minimum: 1}
        mine: {type: boolean, description: The caller reacted with this emoji}
    Reaction:
      type: string
      description: 'An emoji by key: fire 🔥, heart ❤️, laugh 😂, rock 🤘, wow 😮, clap 👏.'
      enum: [fire, heart, laugh, rock, wow, clap]
    Prompt:
      type: object
      required: [id, day, text, source, open, answer_count]
      properties:
        id: {type: string, format: uuid}
        day: {type: string, format: date, description: The Thursday it came out (a day before weekly prompts, for older ones).}
        text: {type: string}
        source: {type: string, enum: [staff, library]}
        open: {type: boolean, description: "It is the prompt's week, so answers can be written"}
        answer_count: {type: integer, minimum: 0}
    PromptAnswer:
      type: object
      required: [id, prompt_id, user, body, visibility, created_at, updated_at, mine, following]
      properties:
        id: {type: string, format: uuid}
        prompt_id: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/UserRef'}
        body: {type: string}
        visibility: {type: string, enum: [public, followers]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        mine: {type: boolean}
        following: {type: boolean, description: The caller follows its author}
    PromptToday:
      type: object
      required: [prompt, my_answer, following_answers, next_prompt_on]
      properties:
        prompt: {$ref: '#/components/schemas/Prompt'}
        next_prompt_on: {type: string, format: date, description: The next Thursday.}
        my_answer:
          oneOf: [{$ref: '#/components/schemas/PromptAnswer'}, {type: 'null'}]
        following_answers:
          type: array
          maxItems: 3
          description: Answers from people the caller follows, once the caller has answered
          items: {$ref: '#/components/schemas/PromptAnswer'}
    TriviaQuestion:
      type: object
      description: |
        Fans of the same artist share the week's question (`day` is the Tuesday it came out). `answer_index`, `correct`, `points_earned`, and `results` are
        only set once the fan has answered.
      required: [id, day, artist, kind, prompt, options, answered, chosen_index, answer_index, correct, points_for_right, points_earned,
                 results]
      properties:
        id: {type: string, format: uuid}
        day: {type: string, format: date}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        kind: {type: string, enum: [track_album, release_year]}
        prompt: {type: string}
        options:
          type: array
          minItems: 2
          maxItems: 4
          items: {type: string}
        answered: {type: boolean}
        chosen_index: {type: [integer, 'null']}
        answer_index: {type: [integer, 'null'], description: Only once answered}
        correct: {type: [boolean, 'null']}
        points_for_right: {type: number}
        points_earned: {type: [number, 'null'], description: 'Once answered: 0, or the points a right answer earned'}
        results:
          description: How the shared question went so far, once the fan has answered
          oneOf:
            - type: object
              required: [answered, right, percent_right, following_right]
              properties:
                answered: {type: integer, minimum: 0, description: Fans who answered it (the caller included)}
                right: {type: integer, minimum: 0}
                percent_right: {type: integer, minimum: 0, maximum: 100}
                following_right:
                  type: array
                  maxItems: 2
                  description: Up to two people the caller follows who got it right, first to answer first
                  items: {$ref: '#/components/schemas/UserRef'}
            - {type: 'null'}
    FeaturedArtist:
      type: object
      required: [id, week_start, week_end, artist, headline, video, song]
      properties:
        id: {type: string, format: uuid}
        week_start: {type: string, format: date}
        week_end: {type: string, format: date}
        artist: {$ref: '#/components/schemas/ArtistRef'}
        headline: {type: [string, 'null']}
        video:
          type: object
          required: [kind, url, embed_url, thumbnail_url]
          properties:
            kind: {type: string, enum: [upload, youtube, tiktok]}
            url: {type: string, format: uri, description: The link to open (a signed link for an upload)}
            embed_url: {type: [string, 'null'], format: uri, description: Plays inside a page (iframe or video element)}
            thumbnail_url: {type: [string, 'null'], format: uri}
        song:
          type: object
          required: [spotify_track_id, title, album_title, cover_url, spotify_url]
          properties:
            spotify_track_id: {type: string}
            title: {type: string}
            album_title: {type: [string, 'null']}
            cover_url: {type: [string, 'null'], format: uri}
            spotify_url: {type: string, format: uri}
    GrabBagPut:
      type: object
      required: [spotify_track_id]
      properties:
        spotify_track_id: {type: string, pattern: '^[0-9A-Za-z]{22}$'}
    TrackSearchResult:
      type: object
      required: [spotify_track_id, title, artists, album_title, cover_url, spotify_url]
      properties:
        spotify_track_id: {type: string}
        title: {type: string}
        artists:
          type: array
          description: In credit order; the first is the primary artist, the one tracked when the song is added.
          items:
            type: object
            required: [spotify_artist_id, name, artist_id]
            properties:
              spotify_artist_id: {type: string}
              name: {type: string}
              artist_id: {type: [string, 'null'], format: uuid, description: Set when the artist is already tracked.}
        album_title: {type: [string, 'null']}
        cover_url: {type: [string, 'null'], format: uri}
        spotify_url: {type: string, format: uri}
    SubmissionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Submission'}
        next_cursor: {type: [string, 'null']}
    VerificationCheck:
      type: object
      required: [id, check_type, result, created_at]
      properties:
        id: {type: string, format: uuid}
        check_type:
          type: string
          enum: [file_hash, metadata, ocr_extract, event_match, order_ref, partner_confirm, manual]
        result: {type: string, enum: [pass, fail, inconclusive]}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        details: {type: object, additionalProperties: true}
        reviewer_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    AdminSubmission:
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          properties:
            user: {$ref: '#/components/schemas/UserRef'}
            trust_score: {type: [number, 'null'], minimum: 0, maximum: 1}
            extracted: {type: object, additionalProperties: true}
            checks:
              type: array
              items: {$ref: '#/components/schemas/VerificationCheck'}
    AdminSubmissionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminSubmission'}
        next_cursor: {type: [string, 'null']}
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason:
          type: string
          maxLength: 500
          description: Required on reject. Shown to the user, so keep it generic.
        event_id: {type: string, format: uuid, description: Not used yet (events come later).}
        notes:
          type: string
          maxLength: 2000
          description: Internal only; stored in the manual check details.

    ShareCard:
      type: object
      required: [id, artist_id, raw_score, percentile, image_url, share_url, created_at]
      properties:
        id: {type: string, format: uuid}
        artist_id: {type: string, format: uuid}
        raw_score: {type: number}
        percentile: {type: number}
        image_url: {type: string, format: uri}
        share_url: {type: string, format: uri}
        shared_to:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        targets:
          type: object
          properties:
            x:
              type: object
              properties:
                intent_url: {type: string, format: uri}
            instagram_stories:
              type: object
              properties:
                background_image_url: {type: string, format: uri}
                sticker_image_url: {type: string, format: uri}
                attribution_url: {type: string, format: uri}
    OutboundClickRequest:
      type: object
      required: [artist_id, kind]
      properties:
        artist_id: {type: string, format: uuid}
        kind: {type: string, enum: [ticket, merch, website]}
        event_id:
          type: string
          format: uuid
          description: Required when kind is ticket.
    OutboundClick:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri}
        partner: {type: [string, 'null']}
    TicketingWebhook:
      type: object
      required: [event_type, partner_order_id, sub_id, purchased_at]
      properties:
        event_type: {type: string, enum: [purchase.confirmed, purchase.refunded]}
        partner_order_id: {type: string}
        sub_id: {type: string, description: The outbound click id passed on the ticket link.}
        event_external_id: {type: string}
        purchased_at: {type: string, format: date-time}
    ReportCreate:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: {type: string, enum: [photo, log, prompt_answer], description: 'photo: a shared submission; log: an album log; prompt_answer: an answer to a music prompt'}
        target_id: {type: string, format: uuid}
        reason: {type: string, enum: [spam, abuse, impersonation, inappropriate, other]}
        details: {type: string, maxLength: 1000}
    ReportedPostPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReportedPost'}
        next_cursor: {type: [string, 'null']}
    ReportedPost:
      type: object
      description: One reported post with its open reports.
      required: [target_type, target_id, author, artist, report_count, reasons, details, first_reported_at]
      properties:
        target_type: {type: string, enum: [photo, log, prompt_answer]}
        target_id: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/UserRef'}
        artist:
          description: Null for a prompt answer.
          oneOf: [{$ref: '#/components/schemas/ArtistRef'}, {type: 'null'}]
        prompt_answer:
          type: [object, 'null']
          required: [prompt_text, body, visibility]
          properties:
            prompt_text: {type: string}
            body: {type: string}
            visibility: {type: string}
        photo:
          type: [object, 'null']
          required: [kind, files]
          properties:
            kind: {$ref: '#/components/schemas/SubmissionKind'}
            caption: {type: [string, 'null']}
            files:
              type: array
              items:
                type: object
                required: [id, mime_type, url, redacted]
                properties:
                  id: {type: string, format: uuid}
                  mime_type: {type: string}
                  url: {type: string, format: uri}
                  redacted: {type: boolean}
        log:
          type: [object, 'null']
          required: [album_id, album_title, visibility]
          properties:
            album_id: {type: string, format: uuid}
            album_title: {type: string}
            rating: {type: [integer, 'null']}
            review: {type: [string, 'null'], description: The full review.}
            visibility: {type: string, enum: [public, followers, private]}
        report_count: {type: integer, minimum: 1}
        reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: {type: string, enum: [spam, abuse, impersonation, inappropriate, other]}
              count: {type: integer}
        details: {type: array, items: {type: string}, description: The latest five reporters' notes.}
        first_reported_at: {type: string, format: date-time}
    ModerationDecision:
      type: object
      required: [target_type, target_id, action, reports_resolved]
      properties:
        target_type: {type: string, enum: [photo, log, prompt_answer]}
        target_id: {type: string, format: uuid}
        action: {type: string, enum: [take_down, dismiss]}
        reports_resolved: {type: integer}

    ScoringRule:
      type: object
      required: [rule_key, points, active]
      properties:
        rule_key: {type: string}
        points: {type: number}
        daily_cap_count: {type: [integer, 'null'], minimum: 1}
        active: {type: boolean}
        description: {type: [string, 'null']}
        saturation:
          type: [number, 'null']
          description: '`spotify_*` rules only: the count at which the signal earns full marks'
    ScoringRuleUpdate:
      type: object
      properties:
        points: {type: number, minimum: 0, exclusiveMaximum: 1000000}
        daily_cap_count: {type: [integer, 'null'], minimum: 1}
        active: {type: boolean}
        saturation: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1000000}
