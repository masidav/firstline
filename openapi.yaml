openapi: 3.1.0
info:
  title: Fandom Score API
  version: 0.1.0
  summary: Mobile-first API for artist fandom scores, an album journal, and fan-proof submissions.
  description: |
    Companion to `database/migrations` and `README.md`. Only artists on the tracked-artist list can be scored,
    journaled, or verified; users add artists by searching (`POST /artists`).

    ## Conventions

    - **Versioning:** URL prefix `/v1`. Breaking changes ship as `/v2`.
    - **Auth:** `Authorization: Bearer <access token>` (JWT, 15 minutes). Refresh tokens rotate on every use.
      Staff-only routes live under `/admin` and require `is_staff` (checked on every request; `403 forbidden` otherwise).
      So every operation without `security: []` can answer `401` (Unauthorized), and every `/admin` operation `403`
      (Forbidden), whether or not it lists them. Every operation can also answer `429` (RateLimited; see Rate limits).
      The test suite checks every response against this file, these rules included (`tests/FandomScore.Tests/Contract`).
    - **Request size:** request bodies are limited to 1 MB, except uploads (their declared size).
    - **Format:** JSON, `snake_case`, UUID ids, RFC 3339 UTC timestamps.
    - **Pagination:** cursor based. Send `limit` (1 to 100, default 25) and `cursor`; read `next_cursor`
      (null on the last page).
    - **Errors:** RFC 9457 `application/problem+json`. The `code` field is stable and meant for client logic.
    - **Idempotency:** creating endpoints accept `Idempotency-Key` (kept 24 hours). Same key and same body
      returns the original response; same key and different body returns `409 idempotency_conflict`.
    - **Async work lives on the resource, not on a job endpoint.** Artist onboarding is `artist.status`,
      Spotify sync is `spotify.sync_state`, score recompute is `score.status`. Triggering calls return `202`.
    - **Points:** write calls that can earn points return `points_awarded` (ledger rows created for that
      action), so the UI can react immediately. Scores recompute asynchronously, so `GET .../score` may
      lag by a few seconds.
    - **Visibility:** logs, lists, and their comments honor `public`, `followers`, `private`. Private
      content returns `404` to everyone but the owner. Until follows ship (Phase 8), `followers` content is
      visible to its owner only.
    - **`x-requires-schema`:** marks operations that need tables not yet in `database/migrations`.
    - **`x-planned`:** marks operations designed here but not built (or no longer planned), with why.

    ## Rate limits

    | Area | Limit |
    | --- | --- |
    | Sign-in and token refresh (`/auth/sessions`, `/auth/refresh`) | 20 per minute per client IP |
    | Add artist (`POST /artists`) | 50 new artists per user per UTC day (`artist_add_limit`) |
    | Artist search and album search (both can call Spotify) | 30 per minute per user |
    | Grab-bag songs (`PUT /me/grab-bag/{position}`: a Spotify lookup, maybe a new artist) | 30 per hour per user |
    | Score refresh (`POST /artists/{id}/score/refresh`) | 10 per hour per user |
    | Score cards (the link, and the image per client IP) | 60 per minute |
    | Follow and unfollow, link clicks | 120 per minute per user |
    | Manual Spotify sync | 1 per 15 minutes per user (automatic sync runs on a schedule) |
    | Submissions | 20 per day per user |
    | Download my data (`GET /me/export`) | 3 per hour per user |
    | Everything (a ceiling on all of the above) | 1,200 per minute per user, or per client IP without sign-in |

    Limited calls return `429` with `Retry-After`.
servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://api.staging.example.com/v1
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Artists
  - name: Scores
  - name: Albums
  - name: Journal
  - name: Comments
  - name: Lists
  - name: Submissions
  - name: Feed
  - name: Share and shop
  - name: Social
  - name: Allocations
    description: Shows and their fan allocations (face-value tickets set aside for top fans).
  - name: Organizations
    description: Promoter organizations and the shows they manage (members only).
  - name: Webhooks
  - name: Admin
  - name: Meta
  - name: Sharing
    description: Score cards a fan shares outside the app.

paths:
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}

  # ------------------------------------------------------------------ Auth
  /auth/sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Sign in with a provider identity token
      description: |
        Exchanges an Apple or Google identity token for app tokens. Creates the account on first sign-in
        (then `handle` is required, and the provider must share a verified email). Spotify is connected
        separately (`PUT /me/spotify`). Each sign-in starts a new session (one per device).
        If `nonce` is sent, the token must carry it, raw (Google) or as its SHA-256 hex (Apple).
        A new provider account whose email already belongs to another account gets `409 email_in_use`;
        each email belongs to one account, and accounts are not linked across providers.
        App Store rules may require offering Sign in with Apple; verify against current guidelines.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionRequest'}
      responses:
        '200':
          description: Existing user signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '201':
          description: New account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: '`handle_taken` or `email_in_use`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate tokens
      description: |
        Returns a new access and refresh token; the old refresh token stops working. Reusing an old refresh
        token revokes the session, so the app must store the new token before using it. Refresh tokens expire
        after 30 days unused, and sessions after 180 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/sessions/current:
    delete:
      tags: [Auth]
      operationId: deleteSession
      summary: Sign out (ends the session of the calling device)
      description: Its refresh token and access tokens stop working immediately. Other devices stay signed in.
      responses:
        '204': {description: Signed out}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MeUpdate'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: '`handle_taken`'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete account
      description: |
        Starts account deletion. Email, handle, display name, avatar, Spotify tokens, and library data are
        removed immediately, and the handle and email become available to new accounts. All sessions end
        and the Apple/Google sign-in is released, so signing in again creates a new account. Deletion cannot
        be undone. 30 days later, the account's logs, lists, comments, and submissions are permanently deleted;
        comments that others replied to remain as "[deleted]" placeholders. Until then that content shows as
        "Deleted user". Points history is kept anonymously for fraud audits and no longer counts.

        For an account that signs in with Apple, the app should first get a fresh authorization code from
        Sign in with Apple and send it; the API uses it to revoke the app's Apple sign-in (App Store
        requirement). Deletion goes ahead even if the code is missing or revocation fails.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apple_authorization_code: {type: string}
      responses:
        '202': {description: Deletion scheduled}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/export:
    get:
      tags: [Me]
      operationId: exportMyData
      summary: Download my data
      description: |
        Everything the app holds about the caller, as one JSON file (`Content-Disposition: attachment`), grouped by area.
        Not included: secrets and tokens (Spotify tokens, refresh-token hashes, push tokens, ticket tokens), hashes
        (order references, file checksums), storage keys, other fans' private data, staff notices, and staff-internal
        verification and moderation details. `services/api/src/features/privacy/README.md` lists every field and why.
        Proof file links (`proof.submissions[].files[].url`) are signed and work for an hour. Limited to 3 per hour per
        user (`429 rate_limited`).
      responses:
        '200':
          description: The export file
          headers:
            Content-Disposition:
              description: '`attachment; filename=fandom-score-export-YYYY-MM-DD.json`'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataExport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/hub-cities:
    put:
      tags: [Me]
      operationId: setHubCities
      summary: Choose hub cities
      description: |
        Replaces the fan's hub cities: a primary city first, then up to two backups, from `GET /cities`. Shows in
        these cities put the fan first in line for allocations. The first choice can be changed any time; after
        that, changes are allowed once a week (`hub_cities_change_available_at` on `Me`). Sending the same list is
        not a change. A registration for an allocation keeps the hubs it was made with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city_ids]
              properties:
                city_ids:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429':
          description: 'Changed less than a week ago (`code: hub_change_limit`); `Retry-After` is when the next change is allowed'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /cities:
    get:
      tags: [Me]
      operationId: searchCities
      summary: Search hub cities
      description: |
        The curated list of US and Canadian metro areas a fan can choose as hub cities. Matches the start of the
        name or of any word in it, or an exact state/province code (`ON`). Without `q`, lists cities by name.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses:
        '200':
          description: Matching cities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/HubCity'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /me/spotify:
    get:
      tags: [Me]
      operationId: getSpotifyConnection
      summary: Spotify connection and sync status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpotifyStatus'}
    put:
      tags: [Me]
      operationId: connectSpotify
      summary: Connect Spotify
      description: |
        The app runs the Spotify authorization (PKCE) and sends the resulting code here. The server
        exchanges it and stores the refresh token encrypted, so Spotify tokens never live on the device.
        Triggers a first sync: it adds the fan's top artists that nobody tracks yet (`top_artists_added`), so
        their artists appear on the home screen right away, and scores tracked artists already active.

        Request every scope: `user-library-read`, `user-top-read`, `user-read-recently-played`,
        `playlist-read-private`, `playlist-read-collaborative`, `user-follow-read`. `redirect_uri` must be one the server allows
        (`Spotify__RedirectUris`) and the same one used for the authorization.

        `422 validation_failed` (field `code`) when Spotify rejects the code, a scope is missing, or Spotify
        refuses the account (in development mode, only Spotify accounts on the app's allowlist can connect).
        Connecting a different Spotify account deletes the data synced from the previous one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpotifyConnect'}
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpotifyStatus'}
        '409':
          description: 'This Spotify account is connected to another user (`code: spotify_in_use`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503':
          description: 'Spotify did not respond, or Spotify is not set up on this server (`code: spotify_unavailable`)'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    delete:
      tags: [Me]
      operationId: disconnectSpotify
      summary: Disconnect Spotify and delete synced library data
      description: |
        Spotify has no API to revoke an app's access; the app should tell users they can also remove it in
        their Spotify account settings. Succeeds when nothing is connected.
      responses:
        '204': {description: Disconnected}
  /me/spotify/sync:
    post:
      tags: [Me]
      operationId: syncSpotify
      summary: Request a Spotify sync now
      description: |
        Only tracked, active artists are counted; everything else is discarded during sync, except that the
        fan's Spotify top artists are added to the tracked list first when nobody tracks them yet
        (`top_artists_added`; the daily artist add limit applies). A sync already `queued` or `running` is returned as is. Otherwise one manual sync per 15 minutes
        (`429 rate_limited`). `409 spotify_not_connected` without a connection; `409 spotify_reauth_required`
        when Spotify rejected the stored authorization (connect again with `PUT /me/spotify`).

        `background=true` is the app's sync when it opens (decided 2026-10-25): when a sync ran or was requested in the
        last 15 minutes, or the authorization needs renewing, it returns the status with `200` and queues nothing;
        otherwise it queues like a manual sync.
      parameters:
        - {name: background, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Background sync not needed now; the current status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpotifyStatus'}
        '202':
          description: Sync queued. Poll `GET /me/spotify` for `sync_state`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpotifyStatus'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /me/spotify/player:
    get:
      tags: [Me]
      operationId: getSpotifyPlayer
      summary: What the fan's Spotify is playing
      description: |
        The fan's own Spotify playback, for the app's now-playing bar (requested 2026-10-26). Read from Spotify on
        request (at most once every 3 seconds per fan) and never stored; it may be any artist, tracked or not, and
        is only ever shown to the fan. Never an error for the connection's state: `not_connected` without a
        connection, `reconnect_needed` when the connection lacks the playback scopes (made before 2026-10-26) or
        Spotify no longer accepts it. `503 spotify_unavailable` while Spotify is down or a sync of this fan is
        renewing the authorization (`Retry-After`).
      responses:
        '200':
          description: The playback state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpotifyPlayer'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /me/spotify/player/play:
    put:
      tags: [Me]
      operationId: playSpotify
      summary: Play a song, or resume
      description: |
        Plays `spotify_track_id` from the start on the fan's Spotify, or resumes without it. Spotify plays on the
        device the fan has Spotify open on; when none is active, the fan's phone, computer, or tablet that Spotify
        lists is used (never a speaker or TV). Errors (`409`): `spotify_not_connected`; `spotify_reauth_required`
        (connect again, also when the connection lacks the playback scopes); `spotify_no_device` (Spotify isn't
        open anywhere: the app opens the song in Spotify instead); `spotify_premium_required` (Spotify only lets
        apps control playback for Premium accounts); `spotify_player_refused` (any other refusal).
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpotifyPlay'}
      responses:
        '204': {description: Spotify accepted it. Read `GET /me/spotify/player` for the new state.}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /me/spotify/player/pause:
    put:
      tags: [Me]
      operationId: pauseSpotify
      summary: Pause
      description: Same errors as `PUT /me/spotify/player/play`.
      responses:
        '204': {description: Spotify accepted it.}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /me/spotify/player/next:
    post:
      tags: [Me]
      operationId: skipSpotifyNext
      summary: Skip to the next song
      description: Same errors as `PUT /me/spotify/player/play`.
      responses:
        '204': {description: Spotify accepted it.}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /me/spotify/player/previous:
    post:
      tags: [Me]
      operationId: skipSpotifyPrevious
      summary: Go back to the previous song
      description: Same errors as `PUT /me/spotify/player/play`.
      responses:
        '204': {description: Spotify accepted it.}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /me/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: {type: string, maxLength: 128}
    put:
      tags: [Me]
      operationId: registerDevice
      summary: Register or update a push device
      x-requires-schema: [push_devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistration'}
      responses:
        '204': {description: Registered}
    delete:
      tags: [Me]
      operationId: unregisterDevice
      summary: Remove a push device
      x-requires-schema: [push_devices]
      responses:
        '204': {description: Removed}
  /uploads:
    post:
      tags: [Me]
      operationId: createUpload
      summary: Get a presigned upload URL
      description: |
        Used for submission photos (avatars aren't supported yet). The client PUTs the file to `url` with
        `headers`; the link is signed and short-lived, so it needs no sign-in. Files land in quarantine storage
        with their metadata (EXIF location, camera details, comments) stripped. JPEG and PNG only: convert HEIC
        or WebP on the device first. 50 uploads per day per user.

        Staff also upload featured-artist videos here (`purpose: featured_video`): MP4 up to 100 MB, stored as
        uploaded; others get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadIntentRequest'}
      responses:
        '201':
          description: Upload intent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadIntent'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /uploads/{uploadId}/content:
    put:
      tags: [Me]
      operationId: putUploadContent
      summary: Upload the file (signed link from POST /uploads)
      description: |
        The `url` from `POST /uploads`; its `exp` and `sig` authorize the request, so no bearer token is sent.
        The body must be the declared type and no bigger than declared (and match `sha256` if it was declared).
      security: []
      parameters:
        - {name: uploadId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: exp, in: query, required: true, schema: {type: integer}}
        - {name: sig, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Stored}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Already uploaded, or expired (`code: upload_expired`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /files/{fileId}:
    get:
      tags: [Submissions]
      operationId: getFile
      summary: A stored submission photo (signed link)
      description: |
        The `url` of a submission file; signed and valid for an hour, so image tags can load it without sign-in.
        Where files are in Cloud Storage, this redirects (302) to a 15-minute storage link instead of sending the
        bytes; image tags and players follow it.
      security: []
      parameters:
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: exp, in: query, required: true, schema: {type: integer}}
        - {name: sig, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The photo
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '302':
          description: The photo is in Cloud Storage; `Location` is a short-lived link to it.
          headers:
            Location:
              schema: {type: string, format: uri}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Artists
  /artists/search:
    get:
      tags: [Artists]
      operationId: searchArtists
      summary: Search Spotify for artists
      description: |
        Searches Spotify and marks each result as tracked or not yet tracked (matched on
        `spotify_artist_id`). Untracked results are not stored. Debounce on the client.
        Spotify returns at most 10 results per search for development-mode apps. 30 searches per minute per user.
        Results that share a name are listed together, most releases first (see `release_count`).
        Does not need the user to have connected Spotify.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ArtistSearchResult'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /artists:
    get:
      tags: [Artists]
      operationId: listArtists
      summary: Browse tracked artists
      description: |
        Tracked artists only; never calls Spotify (use `/artists/search` for that). Paused artists are never listed.
        `fans` sorts by how many fans have a score for the artist.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
          description: Case-insensitive match on the start of the name or of any word in it
        - name: status
          in: query
          schema: {type: string, enum: [onboarding, active, all], default: active}
          description: '`all` is onboarding and active artists'
        - {name: sort, in: query, schema: {type: string, enum: [recent, name, fans], default: fans}}
        - name: added_by_me
          in: query
          schema: {type: boolean, default: false}
          description: Only artists the signed-in fan added, by hand or through a Spotify sync of their top artists
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of artists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [Artists]
      operationId: trackArtist
      summary: Add an artist to the tracked list
      description: |
        Takes a Spotify artist id from search; the server fetches the name and image from Spotify
        (client-supplied names are never trusted) and calls `track_artist()`. A new artist starts as
        `onboarding`; a worker loads the catalog and baseline and then marks it `active`. The adding user
        is synced immediately after activation. An artist that is already tracked is returned as is; when it is
        active and the caller has no score for it yet, the caller's Spotify sync is queued so the score arrives soon.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spotify_artist_id]
              properties:
                spotify_artist_id: {type: string}
      responses:
        '201':
          description: Artist added and onboarding started
          headers:
            Location:
              schema: {type: string}
              description: '`/v1/artists/{artistId}`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
        '200':
          description: Artist was already tracked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
        '404':
          description: 'Spotify does not know this artist (`code: spotify_artist_not_found`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429':
          description: 'Daily add limit reached (`code: artist_add_limit`); `Retry-After` is the next UTC midnight'
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/SpotifyUnavailable'}
  /artists/{artistId}:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    get:
      tags: [Artists]
      operationId: getArtist
      summary: Artist detail
      responses:
        '200':
          description: Artist, including my score summary when one exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artist'}
        '404': {$ref: '#/components/responses/NotFound'}
  /artists/{artistId}/albums:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    get:
      tags: [Artists]
      operationId: listArtistAlbums
      summary: Albums by a tracked artist
      description: |
        The artist's own albums, singles, and compilations from the catalog (ADR 0006), newest first. Releases
        Spotify no longer lists are left out; they stay readable by id for the logs that mention them.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of albums (newest first)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumPage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /artists/{artistId}/events:
