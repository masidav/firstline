      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [items, untracked_artists]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Album'}
                  untracked_artists:
                    type: array
                    items: {$ref: '#/components/schemas/ArtistSearchResult'}
