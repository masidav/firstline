  # ------------------------------------------------------------------ Scores
  /me/stats:
    get:
      tags: [Scores]
      operationId: getMyStats
      summary: My stats in one list
      description: |
        The signed-in fan's numbers, read from stored state and the ledger (never from Spotify at request time).
        Deleted logs and comments and reversed awards don't count. Listening totals cover active tracked artists
        only. `ledger_points` is the sum of unreversed awards (journal, proof of fandom). Other fans' stats:
        `GET /users/{handle}/stats`.
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserStats'}
  /me/scores:
    get:
      tags: [Scores]
      operationId: listMyScores
      summary: My scores across artists
      parameters:
        - {name: sort, in: query, schema: {type: string, enum: [percentile, recent], default: percentile}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page of score summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoreSummaryPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /artists/{artistId}/score:
    parameters:
      - {$ref: '#/components/parameters/ArtistId'}
    get:
      tags: [Scores]
      operationId: getMyScore
      summary: My score for an artist
      description: |
        Always `200` for an onboarding or active artist; `404` for an unknown or paused one. `status` says
        whether numbers are available: `ready`, `computing` (active artist, score not computed yet), or
        `artist_onboarding`.
        `is_estimated` is true while the synthetic baseline dominates the percentile.
      responses:
        '200':
          description: Score
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Score'}
        '404': {$ref: '#/components/responses/NotFound'}
  /artists/{artistId}/score/refresh:
    post:
      tags: [Scores]
      operationId: refreshMyScore
      summary: Request a recompute
      description: Queues a rescore of the artist's fans. At most one is queued per artist, so repeats are free.
      parameters:
        - {$ref: '#/components/parameters/ArtistId'}
      responses:
        '202':
          description: Queued. Poll `GET /artists/{artistId}/score`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Score'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'Artist is still onboarding (`code: artist_not_active`)'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  # ------------------------------------------------------------------ Albums
  /albums/search:
    get:
      tags: [Albums]
      operationId: searchAlbums
      summary: Search albums
      description: |
        Searches the local catalog (tracked artists only) by album title or artist name. Only when nothing
        matches, `untracked_artists` lists Spotify artists with that name that are not tracked yet, so the app
        can prompt "Add this artist first" (empty if Spotify did not answer).
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: artist_id, in: query, schema: {type: string, format: uuid}}
